<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pressio — هديتك</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EFE7DC">
<meta name="color-scheme" content="light">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://sfhqhrqrmakypptqtbxf.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Jost:wght@400;500&display=swap">
<style>
:root{--ground:#EFE7DC;--paper:#F8F3EC;--line:#D8CABA;--ink:#3F322B;--ink-2:#6B584C;--muted:#8E7A6B;--clay:#A25B4A;--ok:#5E7355;--warn:#A8702A;
  font-family:"IBM Plex Sans Arabic","Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;color:var(--ink);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background:radial-gradient(70vmax 55vmax at 92% -8%,#E2CDBC 0,rgba(226,205,188,0) 60%),radial-gradient(60vmax 50vmax at -10% 105%,#DEC9B6 0,rgba(222,201,182,0) 60%),var(--ground);
  display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
[hidden]{display:none!important}
h1,p{margin:0}
.top{width:min(460px,100%);display:flex;align-items:center;justify-content:space-between;min-height:46px}
.logo{display:block;width:112px;aspect-ratio:700/186;background:var(--ink);-webkit-mask:url(../images/logo.webp) center/contain no-repeat;mask:url(../images/logo.webp) center/contain no-repeat}
.lang{border:1px solid var(--line);background:transparent;border-radius:999px;height:38px;min-width:46px;padding:0 12px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
.prev{width:min(460px,100%);margin-top:6px;padding:7px 14px;border-radius:12px;background:#FBF1E3;border:1px solid #EBD5B4;color:#6E4A1C;font-size:13px;text-align:center}
.wrap{flex:1;width:min(460px,100%);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:clamp(8px,2.4svh,24px) 0}
.card{position:relative;overflow:hidden;border-radius:28px;padding:clamp(18px,3.6svh,30px) 22px clamp(16px,3svh,24px);text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.74),rgba(255,255,255,.46));border:1px solid rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 24px 50px -24px rgba(63,50,43,.38)}
/* optional header photo chosen per group in the admin (default: the round gift icon) */
.hero{margin:calc(clamp(18px,3.6svh,30px) * -1) -22px clamp(12px,2.2svh,18px);height:clamp(120px,24svh,210px);background:#E4D8CA;overflow:hidden}
.hero img{display:block;width:100%;height:100%;object-fit:cover}
.ic{width:clamp(46px,8svh,64px);height:clamp(46px,8svh,64px);margin:0 auto clamp(8px,1.6svh,14px);border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#F8F3EC}
.ic svg{width:48%;height:48%}
.card.is-used .ic{background:var(--muted)} .card.is-done .ic{background:var(--ok)} .card.is-warn .ic{background:var(--warn)}
.k{font-size:13.5px;color:var(--muted);letter-spacing:.02em}
html[lang=en] .k{letter-spacing:.14em;text-transform:uppercase;font-size:12px}
h1{font-size:clamp(1.45rem,4.8svh,2.2rem);line-height:1.3;font-weight:600;margin-top:4px;text-wrap:balance;overflow-wrap:anywhere}
.pct{font-family:"Jost",sans-serif;font-size:clamp(2.8rem,10svh,4.6rem);line-height:1;font-weight:500;color:var(--clay);margin-top:4px;direction:ltr}
.note{margin-top:8px;color:var(--ink-2);font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.left{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:999px;background:rgba(94,115,85,.12);color:var(--ok);font-size:13.5px;font-weight:500}
/* the part the barista scans */
.how{margin-top:clamp(12px,2.4svh,20px);padding-top:clamp(12px,2.2svh,18px);border-top:1px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:start}
.qr{width:clamp(96px,16svh,136px);aspect-ratio:1;padding:7px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px rgba(63,50,43,.08)}
.qr svg{display:block;width:100%;height:100%}
.how p{font-size:14px;color:var(--ink-2);line-height:1.5}
.code{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;background:rgba(63,50,43,.07);font-family:"Jost",ui-monospace,monospace;font-size:16px;letter-spacing:.14em;direction:ltr;user-select:all;white-space:nowrap}
.exp{margin-top:6px;font-size:12.5px;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#F8F3EC;text-decoration:none;font:inherit;font-size:15.5px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px}
.btn.staff{background:var(--clay);border-color:var(--clay);color:#fff}
.slink{display:block;text-align:center;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.spin{width:34px;height:34px;margin:26px auto;border-radius:50%;border:3px solid rgba(63,50,43,.15);border-top-color:var(--ink);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.card.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* short screens (small phones, the cover screen of a folding phone) */
@media (max-height:720px){
  body{line-height:1.5;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .top{min-height:40px} .logo{width:100px} .lang{height:34px}
  .wrap{gap:9px;padding:6px 0}
  .card{border-radius:24px;padding:14px 18px 12px}
  .hero{margin:-14px -18px 10px;height:clamp(96px,17svh,150px)}
  .ic{width:42px;height:42px;margin-bottom:6px}
  .pct{font-size:clamp(2.4rem,8.5svh,3.4rem);margin-top:0}
  h1{font-size:clamp(1.25rem,4.2svh,1.7rem);margin-top:2px}
  .note{margin-top:3px;font-size:14px}
  .left{margin-top:6px;font-size:12.5px}
  .how{margin-top:10px;padding-top:10px;gap:12px}
  .qr{width:clamp(88px,15svh,112px);padding:6px}
  .code{margin-top:5px;font-size:15px;padding:2px 11px} .exp{margin-top:4px}
  .btns{gap:8px} .btn{min-height:46px} .foot{margin-top:0;font-size:12px}
}
@media (max-height:600px){ .foot{display:none} .k{display:none} }
/* wide + short screens (a phone held sideways, the open screen of a folding phone): card beside the buttons */
@media (min-width:700px) and (max-height:620px){
  .wrap{width:min(880px,100%);flex-direction:row;align-items:center;gap:22px}
  .top,.prev{width:min(880px,100%)} .card{flex:1.3} .btns{flex:.7}
}
</style>
</head>
<body>
<header class="top"><a href="../" aria-label="pressio"><span class="logo"></span></a><button class="lang" id="lang" type="button" hidden>EN</button></header>
<p class="prev" id="prev" hidden></p>
<main class="wrap" id="wrap"><div class="card"><div class="spin" role="status" aria-label="…"></div></div></main>
<script src="../assets/config.js?v=2"></script>
<script src="../assets/qr.js?v=1"></script>
<script>
(function(){
  "use strict";
  var CFG = window.PRESSIO || {}, $ = function(s){ return document.querySelector(s); };
  function read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function store(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var T = {
    ar: { title: "هديتك", k: "هديتك من pressio", kd: "خصم خاص لك من pressio", how: "ورِّ هالكود للموظف عند الطلب، يمسحه ويأكد هديتك", exp: "صالحة لين ", menu: "شوف المنيو",
          left: function(l, m){ return "باقي " + l + " من " + m + " مرات"; }, daily: "مرة وحدة في اليوم",
          today: "استخدمت هديتك اليوم", todaySub: "تنستخدم مرة وحدة في اليوم — ترجع لك بكرة",
          used: "هالهدية انستخدمت", usedAll: function(m){ return "انستخدمت كل المرات (" + m + ")"; }, usedOn: "آخر استخدام: ", usedSub: "ننتظرك على قهوة ثانية!",
          done: "بالعافية!", doneSub: "تم استخدام هديتك", doneLeft: function(l){ return "باقي لك " + l + (l === 1 ? " مرة" : " مرات"); },
          expired: "انتهت مدة هالهدية", expiredSub: "كانت صالحة لين ", paused: "هالهدية غير مفعّلة حالياً", pausedSub: "اسأل الموظف أو جرّب بعدين.",
          none: "ما لقينا هالكود", noneSub: "تأكد من الرابط أو اسأل الموظف.", err: "ما قدرنا نتصل", errSub: "تأكد من الإنترنت وحاول مرة ثانية.", again: "حاول مرة ثانية",
          prev: "معاينة: هذا شكل الصفحة عند العميل (ما تنحسب زيارة)", back: "رجوع للوحة", foot: "Q1 مول، الورقاء",
          staffBtn: "للموظف: تحقق وأكّد الاستخدام", staffLink: "للموظفين: تحقق وأكّد" },
    en: { title: "Your gift", k: "Your gift from pressio", kd: "A special discount from pressio", how: "Show this to the barista when you order — they'll scan it to confirm your gift", exp: "Valid until ", menu: "See the menu",
          left: function(l, m){ return l + " of " + m + " uses left"; }, daily: "once a day",
          today: "You've used your gift today", todaySub: "It can be used once a day — see you tomorrow",
          used: "This gift has been used", usedAll: function(m){ return "All " + m + " uses have been used"; }, usedOn: "Last used on ", usedSub: "See you for the next coffee!",
          done: "Enjoy!", doneSub: "Your gift has been redeemed", doneLeft: function(l){ return l + (l === 1 ? " use" : " uses") + " left"; },
          expired: "This gift has expired", expiredSub: "It was valid until ", paused: "This gift is not active right now", pausedSub: "Ask the barista or try again later.",
          none: "We couldn't find this code", noneSub: "Check the link or ask the barista.", err: "Couldn't connect", errSub: "Check your internet and try again.", again: "Try again",
          prev: "Preview: this is what the customer sees (not counted as a visit)", back: "Back to the panel", foot: "Q1 Mall, Al Warqa",
          staffBtn: "Staff: verify & confirm", staffLink: "Staff: verify & confirm" }
  };
  var ICON = {
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM3 7h18v4H3zM12 7v14M12 7S10.5 3 8 3a2 2 0 0 0 0 4zM12 7s1.5-4 4-4a2 2 0 0 1 0 4z"/></svg>',
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17h.01"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
  };
  var q = new URLSearchParams(location.search);
  var code = (q.get("c") || location.hash.replace(/^#/, "")).replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 12);
  var preview = q.get("preview") === "1";
  var signedIn = false, staff = false;
  try{
    signedIn = !!(localStorage.getItem("pressio_admin_v2") || sessionStorage.getItem("pressio_admin_v2"));
    staff = signedIn || !!localStorage.getItem("pressio_last_email");
  }catch(e){}
  // A staff phone (signed in to the panel) that taps a sticker or scans this code goes straight to the verify screen.
  if(signedIn && code && !preview){ location.replace("../admin.html#/scan?c=" + encodeURIComponent(code)); return; }

  var only = read("pressio_langs"), lang = only === "ar" || only === "en" ? only : (read("pressio_lang") === "en" ? "en" : "ar");
  var G = null, first = true, timer = 0, back = 0, polls = 0, shown = "", lastUses = null;

  function L(o, base){ return (o && (o[base + "_" + lang] || o[base + "_" + (lang === "ar" ? "en" : "ar")])) || ""; }
  function day(d){ try{ return new Date(String(d).length <= 10 ? d + "T12:00:00" : d).toLocaleDateString(lang === "ar" ? "ar-AE" : "en-GB", {day: "numeric", month: "long", year: "numeric", timeZone: CFG.tz || "Asia/Dubai"}); }catch(e){ return String(d).slice(0, 10); } }
  function pretty(c){ return c.length === 8 ? c.slice(0, 4) + "-" + c.slice(4) : c; }
  function link(c){ return location.origin + location.pathname.replace(/[^\/]*$/, "") + "?c=" + c; }
  function qrSvg(text){
    try{
      var qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
      var n = qr.getModuleCount(), d = "";
      for(var y = 0; y < n; y++) for(var x = 0; x < n; x++) if(qr.isDark(y, x)) d += "M" + x + "," + y + "h1v1h-1z";
      return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" role="img" aria-label="QR"><path d="' + d + '" fill="#3F322B"/></svg>';
    }catch(e){ return ""; }
  }
  var POS = {top: "50% 0%", center: "50% 50%", bottom: "50% 100%"};
  function heroHtml(g){
    if(!g.image || !/^https:\/\/[a-z0-9.-]+\.supabase\.co\/storage\/v1\/object\/public\/media\//.test(g.image)) return "";
    return '<div class="hero"><img src="' + esc(g.image) + '" alt="" style="object-position:' + (POS[g.image_pos] || POS.center) + '" decoding="async" fetchpriority="high"></div>';
  }

  function call(count){
    var ctl = window.AbortController ? new AbortController() : null, to = setTimeout(function(){ if(ctl) ctl.abort(); }, 12000);
    return fetch(CFG.url + "/rest/v1/rpc/gift_view", { method: "POST", signal: ctl ? ctl.signal : undefined,
      headers: {"apikey": CFG.key, "Content-Type": "application/json"}, body: JSON.stringify({p_code: code, p_count: !!count}) })
      .then(function(r){ clearTimeout(to); if(!r.ok) throw new Error(r.status); return r.json(); }, function(e){ clearTimeout(to); throw e; });
  }
  function paint(state){
    var t = T[lang], g = G || {}, h = "", cls = "", btns = "", max = g.max_uses || 1, left = g.left == null ? max : g.left;
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; document.title = "pressio — " + t.title;
    var lb = $("#lang"); lb.hidden = !!only; lb.textContent = lang === "ar" ? "EN" : "ع"; lb.setAttribute("aria-label", lang === "ar" ? "English" : "العربية");
    var pv = $("#prev"); pv.hidden = !preview; pv.textContent = t.prev;
    var title = esc(L(g, "title")), note = esc(L(g, "note")), hero = heroHtml(g);
    var top = hero || '<div class="ic">' + ICON.gift + '</div>';
    var body = (g.kind === "discount" && g.percent ? '<p class="pct">' + esc(g.percent) + '%</p>' : "") + '<h1>' + title + '</h1>' + (note ? '<p class="note">' + note + '</p>' : "");
    if(state === "ok"){
      h = top + '<p class="k">' + (g.kind === "discount" ? t.kd : t.k) + '</p>' + body
        + (max > 1 ? '<p class="left">' + esc(t.left(left, max)) + (g.once_per_day ? " · " + t.daily : "") + '</p>' : "")
        + '<div class="how"><div class="qr">' + qrSvg(link(g.code)) + '</div><div><p>' + t.how + '</p><span class="code">' + esc(pretty(g.code)) + '</span>'
        + (g.expires_on ? '<p class="exp">' + t.exp + esc(day(g.expires_on)) + '</p>' : "") + '</div></div>';
    } else if(state === "done"){
      cls = "is-done"; h = '<div class="ic">' + ICON.ok + '</div><h1>' + t.done + '</h1><p class="note">' + t.doneSub + (title ? ' — ' + title : "") + '</p>'
        + (left > 0 ? '<p class="left">' + esc(t.doneLeft(left)) + '</p>' : "");
    } else if(state === "today"){
      cls = "is-warn"; h = '<div class="ic">' + ICON.clock + '</div><p class="k">' + title + '</p><h1>' + t.today + '</h1><p class="note">' + t.todaySub + '</p>'
        + (left > 0 ? '<p class="left">' + esc(t.left(left, max)) + '</p>' : "");
    } else if(state === "used"){
      cls = "is-used"; h = (hero || '<div class="ic">' + ICON.ok + '</div>') + '<p class="k">' + title + '</p><h1>' + (max > 1 ? esc(t.usedAll(max)) : t.used) + '</h1><p class="note">'
        + (g.redeemed_at ? t.usedOn + esc(day(g.redeemed_at)) + '\n' : "") + t.usedSub + '</p>';
    } else if(state === "expired"){
      cls = "is-warn"; h = '<div class="ic">' + ICON.x + '</div><p class="k">' + title + '</p><h1>' + t.expired + '</h1>' + (g.expires_on ? '<p class="note">' + t.expiredSub + esc(day(g.expires_on)) + '</p>' : "");
    } else if(state === "paused"){
      cls = "is-warn"; h = '<div class="ic">' + ICON.x + '</div><p class="k">' + title + '</p><h1>' + t.paused + '</h1><p class="note">' + t.pausedSub + '</p>';
    } else if(state === "none"){
      cls = "is-warn"; h = '<div class="ic">' + ICON.x + '</div><h1>' + t.none + '</h1><p class="note">' + t.noneSub + '</p>';
    } else {
      cls = "is-warn"; h = '<div class="ic">' + ICON.x + '</div><h1>' + t.err + '</h1><p class="note">' + t.errSub + '</p>';
      btns = '<button class="btn" type="button" id="again">' + t.again + '</button>';
    }
    if(preview && staff) btns += '<a class="btn ghost" href="../admin.html#/gifts">' + t.back + '</a>';
    btns = '<a class="btn' + (btns ? " ghost" : "") + '" href="../?s=gift#menu">' + t.menu + '</a>' + btns;
    // Staff whose phone isn't signed in to the panel in THIS browser (e.g. the sticker opened Safari but they signed in elsewhere):
    // a way into the verify screen — it asks them to sign in once, then checks this code straight away.
    var verify = "../admin.html#/scan?c=" + encodeURIComponent((g && g.code) || code);
    if(code && !preview && state !== "none" && state !== "err"){
      if(staff) btns = '<a class="btn staff" href="' + verify + '">' + t.staffBtn + '</a>' + btns;
      else btns += '<a class="slink" href="' + verify + '">' + t.staffLink + '</a>';
    }
    $("#wrap").innerHTML = '<div class="card pop ' + cls + '" data-state="' + state + '">' + h + '</div><div class="btns">' + btns + '<p class="foot">' + t.foot + '</p></div>';
    var a = $("#again"); if(a) a.onclick = function(){ load(false); };
  }
  function show(state){ shown = state; paint(state); }
  function load(quiet){
    if(!code){ G = null; return show("none"); }
    call(first && !staff && !preview).then(function(g){
      first = false;
      var was = shown, used = lastUses !== null && g.uses > lastUses;
      G = g; lastUses = g.uses;
      only = g.langs === "ar" || g.langs === "en" ? g.langs : ""; if(only) lang = only;
      var st = g.status;
      if(used && (was === "ok" || was === "done")){
        st = "done";
        clearTimeout(back);
        if(g.status === "ok" || g.status === "today") back = setTimeout(function(){ show(g.status); }, 9000);     // uses left → after a moment show the gift (or "come back tomorrow")
      }
      if(quiet && !used && (st === was || was === "done")) return;
      show(st);
    }).catch(function(){ if(!quiet) show("err"); });
  }
  // while the gift is on screen, notice the moment the barista redeems it
  function tick(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      if(document.visibilityState === "visible" && (shown === "ok" || shown === "done") && polls++ < 150) load(true);
      tick();
    }, 4000);
  }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible" && shown === "ok") load(true); });
  $("#lang").onclick = function(){ if(only) return; lang = lang === "ar" ? "en" : "ar"; store("pressio_lang", lang); paint(shown || "err"); };
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  load(false); tick();
})();
</script>
</body>
</html>
