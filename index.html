  // على السيرفر الخاص ما فيه نشر تلقائي — ننزّل الملف والمالك يرفعه
  /* ================= حزمة المنيو: ملف مضغوط فيه إكسل + مجلد صور ================= */

  // ---- أدوات صغيرة ----
  function u8(str){                      // نص → بايتات (UTF-8)
    return new TextEncoder().encode(str);
  }
  function b64ToBytes(b64){
    var bin = atob(b64), n = bin.length, out = new Uint8Array(n);
    for(var i=0;i<n;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function dataURIBytes(u){
    var i = String(u||"").indexOf(",");
    if(i < 0) return new Uint8Array(0);
    return b64ToBytes(u.slice(i+1));
  }
  function bytesToB64(bytes){
    var s = "", CH = 0x8000;
    for(var i=0;i<bytes.length;i+=CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
    return btoa(s);
  }
  var CRC_T = (function(){
    var t = new Uint32Array(256);
    for(var n=0;n<256;n++){
      var c = n;
      for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes){
    var c = 0xFFFFFFFF;
    for(var i=0;i<bytes.length;i++) c = CRC_T[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // ---- كاتب ZIP (بدون ضغط — الصور مضغوطة أصلاً) ----
  function zipBuild(files){              // [{name, bytes}]
    var chunks = [], central = [], off = 0;
    function put(arr){ chunks.push(arr); off += arr.length; }
    function le(n, len){
      var a = new Uint8Array(len);
      for(var i=0;i<len;i++) a[i] = (n >>> (8*i)) & 0xFF;
      return a;
    }
    function cat(parts){
      var total = 0, i;
      for(i=0;i<parts.length;i++) total += parts[i].length;
      var out = new Uint8Array(total), at = 0;
      for(i=0;i<parts.length;i++){ out.set(parts[i], at); at += parts[i].length; }
      return out;
    }
    files.forEach(function(f){
      var nameB = u8(f.name), crc = crc32(f.bytes), start = off;
      put(cat([le(0x04034b50,4), le(20,2), le(0x0800,2), le(0,2), le(0,2), le(0,2),
               le(crc,4), le(f.bytes.length,4), le(f.bytes.length,4),
               le(nameB.length,2), le(0,2), nameB]));
      put(f.bytes);
      central.push(cat([le(0x02014b50,4), le(20,2), le(20,2), le(0x0800,2), le(0,2), le(0,2), le(0,2),
                        le(crc,4), le(f.bytes.length,4), le(f.bytes.length,4),
                        le(nameB.length,2), le(0,2), le(0,2), le(0,2), le(0,2), le(0,4),
                        le(start,4), nameB]));
    });
    var cdStart = off, cd = cat(central);
    put(cd);
    put(cat([le(0x06054b50,4), le(0,2), le(0,2), le(files.length,2), le(files.length,2),
             le(cd.length,4), le(cdStart,4), le(0,2)]));
    return new Blob(chunks, {type:"application/zip"});
  }

  // ---- قارئ ZIP ----
  function zipRead(buf, done){
    var dv = new DataView(buf), n = buf.byteLength, end = -1;
    for(var i = n - 22; i >= 0 && i > n - 66000; i--){
      if(dv.getUint32(i, true) === 0x06054b50){ end = i; break; }
    }
    if(end < 0){ done(null); return; }
    var count = dv.getUint16(end + 10, true), at = dv.getUint32(end + 16, true);
    var entries = [];
    for(var e = 0; e < count; e++){
      if(dv.getUint32(at, true) !== 0x02014b50) break;
      var method = dv.getUint16(at + 10, true);
      var csize  = dv.getUint32(at + 20, true);
      var nameLen = dv.getUint16(at + 28, true);
      var extraLen = dv.getUint16(at + 30, true);
      var cmtLen = dv.getUint16(at + 32, true);
      var lho = dv.getUint32(at + 42, true);
      var name = new TextDecoder().decode(new Uint8Array(buf, at + 46, nameLen));
      var lNameLen = dv.getUint16(lho + 26, true), lExtra = dv.getUint16(lho + 28, true);
      var dataAt = lho + 30 + lNameLen + lExtra;
      entries.push({name:name, method:method, raw:new Uint8Array(buf, dataAt, csize)});
      at += 46 + nameLen + extraLen + cmtLen;
    }
    var out = {}, pending = entries.length;
    if(!pending){ done(out); return; }
    entries.forEach(function(en){
      if(en.method === 0){ out[en.name] = en.raw; if(--pending === 0) done(out); return; }
      if(en.method === 8 && typeof DecompressionStream === "function"){
        try{
          new Response(new Blob([en.raw]).stream().pipeThrough(new DecompressionStream("deflate-raw")))
            .arrayBuffer().then(function(ab){
              out[en.name] = new Uint8Array(ab);
              if(--pending === 0) done(out);
            }).catch(function(){ if(--pending === 0) done(out); });
        }catch(err){ if(--pending === 0) done(out); }
        return;
      }
      if(--pending === 0) done(out);
    });
  }
  function zipSupported(){ return typeof DecompressionStream === "function"; }

  // ---- إكسل: كتابة ----
  function xEsc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
  }
  function colName(i){
    var s = "";
    i++;
    while(i > 0){ var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function sheetXML(rows){
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      + '<cols><col min="1" max="1" width="16"/><col min="2" max="3" width="26"/><col min="4" max="5" width="30"/>'
      + '<col min="6" max="6" width="10"/><col min="7" max="7" width="16"/><col min="8" max="8" width="12"/>'
      + '<col min="9" max="9" width="28"/></cols><sheetData>';
    rows.forEach(function(row, r){
      x += '<row r="' + (r+1) + '">';
      row.forEach(function(cell, c){
        var ref = colName(c) + (r+1);
        if(typeof cell === "number" && isFinite(cell)){
          x += '<c r="' + ref + '"><v>' + cell + '</v></c>';
        } else {
          x += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xEsc(cell) + '</t></is></c>';
        }
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  }
  function xlsxFiles(rows, sheetName){
    return [
      {name:"[Content_Types].xml", bytes:u8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
        + '<Default Extension="xml" ContentType="application/xml"/>'
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
        + '</Types>')},
      {name:"_rels/.rels", bytes:u8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
        + '</Relationships>')},
      {name:"xl/workbook.xml", bytes:u8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
        + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
        + '<sheets><sheet name="' + xEsc(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>')},
      {name:"xl/_rels/workbook.xml.rels", bytes:u8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
        + '</Relationships>')},
      {name:"xl/worksheets/sheet1.xml", bytes:u8(sheetXML(rows))}
    ];
  }

  // ---- إكسل: قراءة ----
  function xlsxRows(files){
    var sheet = files["xl/worksheets/sheet1.xml"];
    if(!sheet) return null;
    var shared = [];
    if(files["xl/sharedStrings.xml"]){
      var sd = new DOMParser().parseFromString(new TextDecoder().decode(files["xl/sharedStrings.xml"]), "application/xml");
      var sis = sd.getElementsByTagName("si");
      for(var i=0;i<sis.length;i++){
        var ts = sis[i].getElementsByTagName("t"), txt = "";
        for(var j=0;j<ts.length;j++) txt += ts[j].textContent;
        shared.push(txt);
      }
    }
    var doc = new DOMParser().parseFromString(new TextDecoder().decode(sheet), "application/xml");
    var rowEls = doc.getElementsByTagName("row"), out = [];
    for(var r=0;r<rowEls.length;r++){
      var cs = rowEls[r].getElementsByTagName("c"), row = [];
      for(var c=0;c<cs.length;c++){
        var el = cs[c], ref = el.getAttribute("r") || "", ty = el.getAttribute("t");
        var ci = 0, letters = ref.replace(/[0-9]/g, "");
        for(var q=0;q<letters.length;q++) ci = ci*26 + (letters.charCodeAt(q) - 64);
        ci = Math.max(0, ci - 1);
        var val = "";
        if(ty === "inlineStr"){
          var its = el.getElementsByTagName("t");
          for(var m=0;m<its.length;m++) val += its[m].textContent;
        } else {
          var vs = el.getElementsByTagName("v");
          val = vs.length ? vs[0].textContent : "";
          if(ty === "s") val = shared[parseInt(val,10)] || "";
        }
        row[ci] = val;
      }
      for(var f=0;f<row.length;f++) if(row[f] === undefined) row[f] = "";
      out.push(row);
    }
    return out;
  }

  /* ---- بناء الحزمة ---- */
  var BUNDLE_COLS = ["المعرّف","القسم","الاسم بالعربي","الاسم بالإنجليزي","الوصف بالعربي","الوصف بالإنجليزي","السعر","ظاهر","ملف الصورة"];

  function extOf(m){ return "jpg"; }
  function fileFor(k, small){ return "images/" + k + (small ? "-sm" : "") + ".jpg"; }

  // يعطي كل صورة مرفوعة اسم ملف ثابت، ويرجّع الملفات الي لازم تنكتب
  function mediaFiles(){
    var out = [], mm = DATA.media || {};
    mediaList().forEach(function(k){
      var m = mm[k]; if(!m || m.kind === "video") return;
      var lg = m.lg || m.src, sm = m.sm || m.lg || m.src;
      if(lg && String(lg).indexOf("data:") === 0) out.push({name:fileFor(k,false), bytes:dataURIBytes(lg)});
      if(sm && String(sm).indexOf("data:") === 0) out.push({name:fileFor(k,true),  bytes:dataURIBytes(sm)});
    });
    return out;
  }
  // عدد الصور الي لسه محشورة في الصفحة وما انكتبت كملفات
  function pendingCount(){
    var n = 0, mm = DATA.media || {};
    mediaList().forEach(function(k){ if(mm[k] && mm[k].kind !== "video" && !mm[k].file) n++; });
    return n;
  }
  // بعد ما نكتب الملفات، البيانات تشير عليها وتتخلص من النسخ الثقيلة
  function pointToFiles(data){
    var mm = data.media || {};
    for(var k in mm){
      var m = mm[k]; if(!m || m.kind === "video") continue;
      m.file = fileFor(k,false); m.filesm = fileFor(k,true);
      delete m.lg; delete m.sm; delete m.src;
    }
    return data;
  }

  function menuRows(){
    var rows = [BUNDLE_COLS.slice()];
    DATA.cats.forEach(function(c){
      c.items.forEach(function(it){
        var k = (it.imgs && it.imgs[0]) || "";
        rows.push([
          it.id, (c.ar || c.en || c.id), it.ar || "", it.en || "",
          it.dar || "", it.den || "", Number(it.p) || 0,
          isHidden(it) ? "لا" : "نعم",
          isUp(k) ? fileFor(k,false) : k
        ]);
      });
    });
    return rows;
  }

  function buildBundle(done){
    var files = [];
    // الإكسل
    var xls = xlsxFiles(menuRows(), "المنيو");
    files.push({name:"menu.xlsx", bytes:new Uint8Array(0), _inner:xls});
    // الصور
    mediaFiles().forEach(function(f){ files.push(f); });
    // تعليمات قصيرة
    files.push({name:"اقرأني.txt", bytes:u8(
      "حزمة منيو pressio\n\n" +
      "1) افتح menu.xlsx وعدّل الأسماء والأسعار والأقسام.\n" +
      "   لا تغيّر عمود «المعرّف» — هو الي يربط الصف بالصنف.\n" +
      "   عمود «ظاهر»: اكتب نعم أو لا.\n" +
      "   عمود «ملف الصورة»: اكتب اسم ملف من مجلد images.\n\n" +
      "2) مجلد images فيه صور المنيو. تقدر تبدّل أي صورة بنفس الاسم،\n" +
      "   أو تضيف صور يديدة وتكتب أسماءها في عمود «ملف الصورة».\n\n" +
      "3) اضغط الحزمة كلها zip وارفعها من لوحة الإدارة ← مكتبة الصور ← ارفع حزمة معدّلة.\n")});

    // نبني الإكسل كملف مضغوط جوّا الحزمة
    var inner = files.filter(function(f){ return f._inner; })[0];
    var xlsBlob = zipBuild(inner._inner);
    xlsBlob.arrayBuffer().then(function(ab){
      inner.bytes = new Uint8Array(ab);
      delete inner._inner;
      done(zipBuild(files));
    }).catch(function(){ done(null); });
  }

  /* ---- قراءة حزمة معدّلة ---- */
  function applyBundle(map, done){
    var report = {rows:0, imgs:0};
    // 1) الصور
    var pend = 0, finished = false;
    function maybeDone(){ if(finished && pend === 0) done(report); }

    Object.keys(map).forEach(function(name){
      if(!/^images\//i.test(name)) return;
      if(/-sm\.(jpg|jpeg|png|webp)$/i.test(name)) return;      // الصغيرة نولّدها إحنا
      if(!/\.(jpg|jpeg|png|webp)$/i.test(name)) return;
      var base = name.replace(/^images\//i, "").replace(/\.[^.]+$/, "");
      var key = isUp(base) ? base : (UP_PREFIX + base.replace(/[^A-Za-z0-9_\-]/g, "").slice(0,24));
      var blob = new Blob([map[name]]);
      pend++;
      var fr = new FileReader();
      fr.onload = function(){
        var im = new Image();
        im.onload = function(){
          try{
            var lg = resizeTo(im, MAX_EDGE, JPEG_Q), sm = resizeTo(im, IMG_SM, JPEG_Q_SM);
            if(!DATA.media) DATA.media = {};
            DATA.media[key] = {kind:"image", lg:lg.url, sm:sm.url, w:lg.w, h:lg.h, name:base};
            report.imgs++;
          }catch(e){}
          pend--; maybeDone();
        };
        im.onerror = function(){ pend--; maybeDone(); };
        im.src = fr.result;
      };
      fr.onerror = function(){ pend--; maybeDone(); };
      fr.readAsDataURL(blob);
    });

    // 2) الإكسل
    var xname = Object.keys(map).filter(function(n){ return /menu\.xlsx$/i.test(n); })[0];
    if(xname){
      zipRead(map[xname].buffer.slice(map[xname].byteOffset, map[xname].byteOffset + map[xname].byteLength), function(xf){
        if(xf){
          var rows = xlsxRows(xf);
          if(rows && rows.length > 1){
            var byId = {};
            DATA.cats.forEach(function(c){ c.items.forEach(function(it){ byId[it.id] = {c:c, it:it}; }); });
            for(var r=1;r<rows.length;r++){
              var row = rows[r]; if(!row || !row[0]) continue;
              var hit = byId[String(row[0]).trim()]; if(!hit) continue;
              var it = hit.it;
              if(row[2] !== "") it.ar = String(row[2]);
              if(row[3] !== "") it.en = String(row[3]);
              it.dar = String(row[4] || "");
              it.den = String(row[5] || "");
              var pnum = parseFloat(String(row[6]).replace(/[^\d.]/g,""));
              if(isFinite(pnum)) it.p = pnum;
              var vis = String(row[7] || "").trim();
              if(vis){
                var off = /^(لا|no|false|0|مخفي|hidden)$/i.test(vis);
                it.out = off;                       // «لا» = مخفي نهائياً
                if(!off){ delete it.snoozeUntil; delete it.snoozeBy; }
              }
              var imgf = String(row[8] || "").trim();
              if(imgf){
                var base2 = imgf.replace(/^images\//i, "").replace(/\.[^.]+$/, "");
                var key2 = isUp(base2) ? base2
                         : (media(UP_PREFIX + base2) ? UP_PREFIX + base2
                         : (IMGS.indexOf(imgf) >= 0 ? imgf : null));
                if(key2) it.imgs = [key2].concat((it.imgs||[]).filter(function(x){ return x !== key2; }));
              }
              report.rows++;
            }
          }
        }
        finished = true; maybeDone();
      });
    } else { finished = true; maybeDone(); }
  }

  function browserDownload(filename, data){
    try{
      var a = document.createElement("a");
      a.href = data; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      return true;
    }catch(e){ return false; }
  }

  // بعض المتصفحات تمنع التنزيل التلقائي لما تفتح الملف من الجهاز مباشرة.
  // فبدل ما نعتمد على نقرة مصطنعة، نعطيه رابط يضغطه بنفسه — هذي ما تنمنع.
  var pendingDoc = null;   // {url, size}

  function prepareDoc(){
    if(pendingDoc && pendingDoc.url){ URL.revokeObjectURL(pendingDoc.url); }
    var html = buildDoc();
    var blob = new Blob([html], {type:"text/html;charset=utf-8"});
    pendingDoc = {url: URL.createObjectURL(blob), size: blob.size, blob: blob,
                  name: "index.html", imgs: 0};
    return pendingDoc;
  }

  // لو فيه صور يديدة، الحفظ ينزّل ملف مضغوط فيه الصفحة ومجلد الصور مع بعض
  function prepareSitePack(done){
    var files = mediaFiles();
    if(!files.length){ done(prepareDoc()); return; }
    if(pendingDoc && pendingDoc.url){ URL.revokeObjectURL(pendingDoc.url); }
    var all = [{name:"index.html", bytes:u8(buildDoc())}].concat(files);
    all.push({name:"اقرأني.txt", bytes:u8(
      "ارفع على GitHub:\n" +
      "  index.html   ← بدل القديم\n" +
      "  مجلد images  ← اسحبه كامل\n\n" +
      "لا تحذف ملف CNAME ولا status.json.\n")});
    var blob = zipBuild(all);
    pendingDoc = {url: URL.createObjectURL(blob), size: blob.size, blob: blob,
                  name: "pressio-site.zip", imgs: files.length / 2};
    done(pendingDoc);
  }

  // أحسن طريقة لو المتصفح يدعمها: يحفظ فوق الملف نفسه مباشرة
  function saveOverFile(){
    if(!window.showSaveFilePicker) return Promise.resolve(false);
    return window.showSaveFilePicker({
      suggestedName: "index.html",
      types: [{description: "صفحة الموقع", accept: {"text/html": [".html"]}}]
    }).then(function(handle){
      return handle.createWritable().then(function(w){
        return w.write(pendingDoc.blob).then(function(){ return w.close(); });
      });
    }).then(function(){ return true; })
      .catch(function(){ return false; });   // لو ألغى الاختيار
  }

  function docSheetHTML(L){
    var t = T[L], h = "";
    var kb = pendingDoc ? Math.round(pendingDoc.size/1024) : 0;
    var fname = (pendingDoc && pendingDoc.name) || "index.html";
    var zipMode = fname !== "index.html";
    h += '<h3>' + esc(t.fileReady) + '</h3>';
    h += '<p class="sub">' + esc(zipMode ? t.pendNote : t.fileReadyNote) + '</p>';
    h += '<div class="statusbar good"><span class="dot"></span><span>' + esc(fname) + ' · <b>'
       + kb + ' KB</b>' + (zipMode && pendingDoc.imgs ? ' · ' + Math.round(pendingDoc.imgs) + ' ' + esc(t.bundleImgs) : '') + '</span></div>';
    if(window.showSaveFilePicker && !zipMode){
      h += '<button class="bigbtn" data-act="saveover">' + esc(t.saveOver) + '</button>';
    }
    h += '<a class="bigbtn ghost dl" download="' + esc(fname) + '" href="'
       + esc(pendingDoc ? pendingDoc.url : "#") + '">' + esc(t.downloadIt) + '</a>';
    h += '<p class="sub">' + esc(t.uploadHint) + '</p>';
    h += '<button class="bigbtn ghost" data-act="docclose">' + esc(t.close) + '</button>';
    return h;
  }

  function save(btn){
    var s = document.querySelector(".adminbar .status");
    btn.disabled = true;
    if(s){ s.className="status"; s.textContent = T[lang].saving; }

    // استضافة خاصة: نجهّز الملف ونعطيه رابط يضغطه — التنزيل التلقائي ينمنع أحياناً
    if(!(window.claude && window.claude.use)){
      try{
        prepareSitePack(function(){
          sheet = {mode:"doc"};
          if(s){ s.className="status ok"; s.textContent = T[lang].fileReady; }
          render(); renderSheet();
          refreshSaveBtn();
        });
      }catch(err){
        if(s){ s.className="status err"; s.textContent = T[lang].dlFailed; }
        refreshSaveBtn();
      }
      return;
    }

    window.claude.use("artifact")
      .then(function(a){
        if(!a) throw {code:"not_granted"};
        return a.publish(buildDoc());
      })
      .then(function(){
        dirty = false;
        if(s){ s.className="status ok"; s.textContent = T[lang].saved; }
      })
      .catch(function(err){
        var code = (err && err.code) || "upstream_error";
        if(code==="conflict"){ return; }
        dirty = true;
        if(s){
          s.className="status err";
          s.textContent = (code==="not_writer"||code==="not_granted"||code==="not_declared")
            ? (lang==="ar" ? "ما عندك صلاحية حفظ" : "Read-only view")
            : (lang==="ar" ? "ما انحفظ، جرب مرة ثانية" : "Save failed, try again");
        }
        refreshSaveBtn();
      });
  }

  function downloadQR(){
    if(!window.claude || !window.claude.use){
      browserDownload("pressio-menu-qr.png", QR_SRC);
      return;
    }
    window.claude.use("downloads").then(function(d){
      if(!d){ browserDownload("pressio-menu-qr.png", QR_SRC); return; }
      return d.save({filename:"pressio-menu-qr.png", data:QR_SRC});
    }).catch(function(){ browserDownload("pressio-menu-qr.png", QR_SRC); });
  }

  // كل نصف دقيقة: لو انتهت مدة إخفاء، الصنف يرجع للمنيو من نفسه
  setInterval(function(){
    var due = false;
    DATA.cats.forEach(function(c){ c.items.forEach(function(it){
      if(it.snoozeUntil && Date.now() >= it.snoozeUntil){ clearSnooze(it); due = true; }
    }); });
    if(due) rerenderAll();
    else if(sheet || ptab === "menu") renderSheet();
  }, 30000);

  window.addEventListener("beforeunload", function(e){
    if(dirty){ e.preventDefault(); e.returnValue = ""; }
  });

  render();
  watchStatus();
})();
</script>
