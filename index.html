<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="pressio — قهوة مختصة في الراشدية، دبي. المنيو، برنامج الولاء، والطلب أونلاين.">
<meta name="theme-color" content="#F2EDE6">
<link rel="canonical" href="https://pressio.ae/">
<meta property="og:title" content="pressio — Speciality Coffee">
<meta property="og:description" content="Pause. Sip. Pressio">
<meta property="og:url" content="https://pressio.ae/">
<meta property="og:type" content="website">
<title>موقع pressio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap">

<style id="css">
:root{
  --ground:#EFE7DC;
  --surface:#F8F3EC;
  --surface-2:#E4D8CA;
  --line:#D5C6B6;
  --line-soft:#E1D6C8;
  --ink:#3F322B;
  --ink-2:#6B584C;
  --muted:#948070;
  --accent:#B4948A;
  --ok:#5E7355;
  --off:#A25B4A;
  --logo-w:min(268px,56vw);
  --logo-src:url(images/brand/logo.png);
  --topnav-h:56px;
  --catnav-h:45px;
  --hero-src:url(images/hero/hero.jpg);
  --ph-cup:url(images/menu/cup.jpg);
  --ph-latte:url(images/menu/latte.jpg);
  --ph-cookie:url(images/menu/cookie.jpg);
  --ph-cake:url(images/menu/cake.jpg);
  --ph-crois:url(images/menu/crois.jpg);
  --ph-twist:url(images/menu/twist.jpg);
  --ph-int1:url(images/interior/int1.jpg);
  --ph-int2:url(images/interior/int2.jpg);
  --ph-int3:url(images/interior/int3.jpg);
  --ph-int4:url(images/interior/int4.jpg);
  --ph-pistachio:url(images/menu/pistachio.jpg);
  --ph-slice:url(images/menu/slice.jpg);
  --ph-smatcha:url(images/menu/smatcha.jpg);
  --ph-hotchoc:url(images/menu/hotchoc.jpg);
  --ph-berryswirl:url(images/menu/berryswirl.jpg);
  --ph-flatwhite:url(images/menu/flatwhite.jpg);
  --ph-softberry:url(images/menu/softberry.jpg);
  --ph-biscoff:url(images/menu/biscoff.jpg);
  --ph-berrycup:url(images/menu/berrycup.jpg);
  --ph-beans:url(images/menu/beans.jpg);
  --ph-mango:url(images/menu/mango.jpg);
  --ph-caramel:url(images/menu/caramel.jpg);
  --ph-matchafrappe:url(images/menu/matchafrappe.jpg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1F1815;--surface:#2A2019;--surface-2:#352921;--line:#4B3A31;--line-soft:#3C2E26;
    --ink:#F3EAE0;--ink-2:#CFBDAB;--muted:#9C8878;--accent:#CBA89B;--ok:#96AE8C;--off:#DD9382;
  }
}
:root[data-theme="dark"]{
  --ground:#1F1815;--surface:#2A2019;--surface-2:#352921;--line:#4B3A31;--line-soft:#3C2E26;
  --ink:#F3EAE0;--ink-2:#CFBDAB;--muted:#9C8878;--accent:#CBA89B;--ok:#96AE8C;--off:#DD9382;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{
  background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
body.lb-open{overflow:hidden;}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 clamp(16px,4vw,28px);}

button:focus-visible,a:focus-visible,input:focus-visible,[contenteditable]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;}
#app{transition:opacity .22s ease;}
#app.swapping{opacity:0;}

.logo{width:var(--logo-w);aspect-ratio:3.771;background-color:var(--ink);
  -webkit-mask:var(--logo-src) center/contain no-repeat;mask:var(--logo-src) center/contain no-repeat;}
.tagline{font-family:"Jost",Futura,"Century Gothic",sans-serif;font-weight:300;
  font-size:clamp(9px,2.2vw,10.5px);letter-spacing:.44em;text-transform:uppercase;
  color:var(--muted);direction:ltr;margin:0;padding-inline-start:.44em;text-align:center;}
.rule{width:36px;height:1px;background:var(--accent);}

/* ---------- nav bar ---------- */
nav.topnav{position:sticky;top:0;z-index:40;height:var(--topnav-h);
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);}
nav.topnav .inner{max-width:1040px;margin:0 auto;height:100%;
  padding:0 clamp(12px,3.5vw,28px);display:flex;align-items:center;
  gap:clamp(10px,3vw,24px);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
nav.topnav .inner::-webkit-scrollbar{display:none;}
.navlogo{width:clamp(58px,14vw,92px);aspect-ratio:3.771;flex:none;cursor:pointer;
  background-color:var(--ink);border:0;padding:0;
  -webkit-mask:var(--logo-src) center/contain no-repeat;mask:var(--logo-src) center/contain no-repeat;
  -webkit-tap-highlight-color:transparent;opacity:.92;transition:opacity .2s ease;}
.navlogo:hover{opacity:1;}
nav.topnav .tab{background:none;border:0;padding:0;cursor:pointer;font-family:inherit;
  font-size:clamp(12.5px,3.1vw,14px);font-weight:600;color:var(--muted);position:relative;
  height:100%;white-space:nowrap;flex:none;-webkit-tap-highlight-color:transparent;transition:color .2s ease;}
nav.topnav .tab:hover{color:var(--ink);}
nav.topnav .tab.on{color:var(--ink);}
nav.topnav .tab.on::after{content:"";position:absolute;inset-inline:0;bottom:0;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0;}
.langwrap{margin-inline-start:auto;display:flex;gap:4px;flex:none;padding-inline-start:8px;}
.pill{font-family:"Jost",sans-serif;font-weight:400;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;background:transparent;color:var(--muted);
  border:1px solid var(--line);border-radius:100px;padding:3px 11px;cursor:pointer;line-height:1.7;
  transition:color .2s ease,border-color .2s ease,background .2s ease;-webkit-tap-highlight-color:transparent;}
.pill:hover{color:var(--ink);border-color:var(--ink-2);}
.pill.on{background:var(--ink);color:var(--ground);border-color:var(--ink);}

/* ---------- hero ---------- */
.hero{position:relative;width:100%;height:clamp(390px,70vh,620px);overflow:hidden;
  display:grid;place-items:center;background:var(--surface-2);}
.hero-bg{position:absolute;inset:0;background:var(--hero-src) center/cover no-repeat;
  transform:scale(1.07);animation:heroZoom 18s cubic-bezier(.2,.6,.3,1) forwards;}
@keyframes heroZoom{to{transform:scale(1);}}
.hero-scrim{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(30,21,15,.46) 0%,rgba(30,21,15,.30) 40%,rgba(30,21,15,.68) 100%);}
.hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:clamp(13px,2.6vw,18px);padding:24px;text-align:center;
  animation:heroIn .9s cubic-bezier(.2,.7,.3,1) both;}
@keyframes heroIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.hero-line{margin:0;font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:500;
  font-size:clamp(19px,5vw,30px);color:#F7F1E8;line-height:1.35;letter-spacing:.01em;
  text-shadow:0 2px 18px rgba(20,14,10,.45);}
.hero .rule{background:rgba(247,241,232,.62);width:44px;}
.hero .tagline{color:rgba(247,241,232,.88);}
.hero-cta{margin-top:6px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  color:#3F322B;background:#F7F1E8;border:1px solid #F7F1E8;border-radius:100px;
  padding:9px 26px;line-height:1.7;-webkit-tap-highlight-color:transparent;
  transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 6px 22px rgba(20,14,10,.18);}
.hero-cta:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(20,14,10,.26);}

/* ---------- search ---------- */
.searchrow{padding:clamp(16px,3.4vw,24px) 0 0;}
.search{position:relative;display:flex;align-items:center;}
.search svg{position:absolute;inset-inline-start:16px;width:15px;height:15px;
  stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none;}
.search input{width:100%;font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:100px;
  padding:11px 18px;padding-inline-start:42px;outline-offset:2px;
  transition:border-color .2s ease,box-shadow .2s ease;}
.search input::placeholder{color:var(--muted);}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;}
.qclear{position:absolute;inset-inline-end:10px;width:26px;height:26px;border-radius:50%;
  border:0;background:var(--surface-2);color:var(--ink-2);font-size:15px;line-height:1;
  cursor:pointer;display:none;place-items:center;-webkit-tap-highlight-color:transparent;}
.search.has .qclear{display:grid;}
[hidden]{display:none !important;}
.noresult{padding:52px 0;text-align:center;color:var(--muted);font-size:14.5px;}

/* ---------- delivery ---------- */
.delivery{display:grid;gap:clamp(10px,2.2vw,14px);
  grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));}
.dcard{display:flex;flex-direction:column;gap:3px;padding:16px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  -webkit-tap-highlight-color:transparent;}
.dcard:hover{border-color:var(--accent);transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(60,42,30,.10);}
.dcard .n{font-weight:600;font-size:15px;}
.dcard .s{font-size:12.5px;color:var(--muted);}
.dcard[data-empty="1"]{opacity:.55;}

/* ---------- loyalty ---------- */
.loyal{display:flex;flex-direction:column;gap:clamp(26px,5vw,44px);padding-top:clamp(26px,6vw,44px);}
.loyal-top{display:grid;gap:clamp(20px,4vw,36px);align-items:center;
  grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));}
.wcard{width:100%;max-width:350px;justify-self:center;background:#F3E1D3;border-radius:22px;
  padding:22px;box-shadow:0 18px 44px rgba(45,31,22,.20);display:flex;flex-direction:column;
  gap:20px;color:#3F322B;direction:ltr;text-align:left;}
.wcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.wlogo{width:104px;aspect-ratio:3.771;background-color:#3F322B;
  -webkit-mask:var(--logo-src) center/contain no-repeat;mask:var(--logo-src) center/contain no-repeat;}
.wcount{text-align:right;font-family:"Jost",sans-serif;font-size:10px;letter-spacing:.16em;color:#7A675A;}
.wcount b{display:block;font-size:24px;font-weight:400;letter-spacing:0;color:#3F322B;line-height:1.2;}
.wcups{display:flex;align-items:flex-end;gap:2px;padding:6px 0 2px;}
.wcups img{flex:1;min-width:0;width:100%;height:auto;display:block;}
.wrow{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;}
.wrow .k{font-family:"Jost",sans-serif;font-size:9.5px;letter-spacing:.16em;color:#7A675A;text-transform:uppercase;}
.wrow .v{font-size:19px;font-weight:500;}
.wqr{align-self:center;background:#fff;border-radius:10px;padding:9px;width:132px;
  display:block;text-decoration:none;cursor:pointer;}
.wqr:hover{box-shadow:0 0 0 3px rgba(255,255,255,.35);}
.wqr svg{display:block;width:100%;height:auto;}
.wno{display:block;text-align:center;font-family:"Jost",sans-serif;font-size:11px;
  letter-spacing:.14em;color:#3F322B;margin-top:7px;}
.loyal-copy{display:flex;flex-direction:column;gap:12px;}
.loyal-copy h2{margin:0;font-size:clamp(20px,4.4vw,26px);font-weight:600;line-height:1.4;}
.loyal-copy p{margin:0;font-size:clamp(14px,3.2vw,15.5px);color:var(--ink-2);line-height:1.85;}
.joinbtn{align-self:flex-start;margin-top:4px;font-family:inherit;font-size:14px;font-weight:600;
  text-decoration:none;color:var(--ground);background:var(--ink);border:1px solid var(--ink);
  border-radius:100px;padding:11px 28px;line-height:1.6;display:inline-block;
  transition:transform .2s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent;}
.joinbtn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(45,31,22,.22);}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:clamp(10px,2.2vw,14px);
  grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));}
ol.steps li{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;display:flex;flex-direction:column;gap:5px;}
ol.steps .sn{font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.16em;color:var(--accent);direction:ltr;}
:root[dir="rtl"] ol.steps .sn{text-align:right;}
ol.steps h3{margin:0;font-size:14.5px;font-weight:600;}
ol.steps p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6;}

/* ---------- staff ---------- */
.toast{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:80;
  display:flex;justify-content:center;pointer-events:none;}
.toast span{background:var(--ink);color:var(--ground);font-size:13px;font-weight:500;
  padding:9px 20px;border-radius:100px;box-shadow:0 8px 26px rgba(35,24,17,.28);
  animation:toastIn .3s cubic-bezier(.2,.7,.3,1) both;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.staffchip{font-family:"Jost",sans-serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);border:1px solid currentColor;border-radius:100px;padding:3px 10px;direction:ltr;}


/* ---------- auth + staff app ---------- */
.authwrap{position:fixed;inset:0;z-index:95;display:none;overflow-y:auto;
  background:color-mix(in srgb,var(--ground) 96%,#000);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.authwrap.on{display:block;}
.authbox{max-width:400px;margin:0 auto;padding:clamp(40px,10vh,90px) 22px 60px;
  display:flex;flex-direction:column;gap:18px;}
.authbox .logo{width:min(210px,52vw);align-self:center;}
.authbox h2{margin:0;font-size:19px;font-weight:600;text-align:center;}
.authbox .sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin:0;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;color:var(--muted);}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  outline-offset:2px;transition:border-color .2s ease,box-shadow .2s ease;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);outline:none;}
.field textarea{min-height:74px;resize:vertical;line-height:1.7;}
.bigbtn{font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;width:100%;
  color:var(--ground);background:var(--ink);border:1px solid var(--ink);border-radius:10px;
  padding:12px 20px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  transition:transform .18s ease,box-shadow .18s ease;}
.bigbtn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(45,31,22,.2);}
.bigbtn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line);}
.autherr{font-size:13px;color:var(--off);text-align:center;min-height:19px;}

.demobar{background:var(--warn-bg,#F4E8D2);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:11px 15px;font-size:12.5px;line-height:1.7;}

.panel{display:flex;flex-direction:column;gap:clamp(20px,4vw,30px);
  padding-top:clamp(22px,5vw,36px);min-width:0;}
.pbox,.row-i,.field,.grid2{min-width:0;}
.field input,.field select,.field textarea{max-width:100%;}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;}
.ptab{font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:6px 16px;
  line-height:1.7;-webkit-tap-highlight-color:transparent;transition:all .18s ease;}
.ptab:hover{color:var(--ink);}
.ptab.on{background:var(--ink);color:var(--ground);border-color:var(--ink);}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:clamp(18px,4vw,24px);display:flex;flex-direction:column;gap:15px;}
.pbox h3{margin:0;font-size:16px;font-weight:600;}
.pbox .hint{font-size:12.5px;color:var(--muted);line-height:1.7;}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:12px 15px;background:var(--surface-2);border-radius:10px;}
.sumrow .k{font-size:13px;color:var(--ink-2);}
.sumrow .v{font-family:"Jost",sans-serif;font-weight:500;font-size:20px;
  font-variant-numeric:tabular-nums;direction:ltr;}

.rows{display:flex;flex-direction:column;gap:9px;}
.row-i{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;
  padding:10px 12px;border:1px solid var(--line-soft);border-radius:10px;background:var(--ground);}
.row-i .th{width:52px;height:52px;border-radius:7px;background:var(--surface-2) center/cover no-repeat;
  display:grid;place-items:center;font-size:10px;color:var(--muted);font-family:"Jost",sans-serif;}
.row-i .m{display:flex;flex-direction:column;gap:1px;min-width:0;}
.row-i .m b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-i .m span{font-size:11.5px;color:var(--muted);}
.pill-s{font-family:"Jost",sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 9px;border-radius:100px;border:1px solid currentColor;white-space:nowrap;
  color:var(--warn,#9A6B20);}
.pill-s.ok{color:var(--ok);}
.empty{padding:26px 0;text-align:center;color:var(--muted);font-size:13.5px;}
.xbtn{background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 6px;
  -webkit-tap-highlight-color:transparent;}
.xbtn:hover{color:var(--off);}
.who{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);}
.who b{font-weight:600;color:var(--ink);}


/* ---------- three-dot actions + sheets ---------- */
.dots{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;
  background:color-mix(in srgb,#141008 62%,transparent);color:#F7F1E8;border:0;cursor:pointer;
  display:none;place-items:center;font-size:17px;line-height:1;padding:0;z-index:3;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);-webkit-tap-highlight-color:transparent;
  transition:transform .16s ease;}
.dots:hover{transform:scale(1.06);}
body.editing .card .dots,body.staffmode .card .dots{display:grid;}
.imgcount{position:absolute;bottom:8px;inset-inline-end:8px;z-index:2;
  font-family:"Jost",sans-serif;font-size:10px;letter-spacing:.06em;
  background:color-mix(in srgb,#141008 55%,transparent);color:#F7F1E8;
  padding:2px 8px;border-radius:100px;backdrop-filter:blur(4px);}

.scrim{position:fixed;inset:0;z-index:100;display:none;
  background:color-mix(in srgb,#1B1410 62%,transparent);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.scrim.on{display:flex;align-items:flex-end;justify-content:center;}
@media (min-width:640px){ .scrim.on{align-items:center;} }
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  animation:sheetIn .26s cubic-bezier(.2,.7,.3,1) both;}
@media (min-width:640px){ .sheet{border-radius:18px;margin:20px;} }
@keyframes sheetIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
.sheet h3{margin:0;font-size:16px;font-weight:600;}
.sheet .sub{font-size:12.5px;color:var(--muted);margin:0;}
.sheet-acts{display:flex;flex-direction:column;gap:6px;}
.sact{display:flex;align-items:center;gap:11px;width:100%;text-align:start;
  font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--ground);
  border:1px solid var(--line-soft);border-radius:11px;padding:12px 15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:border-color .16s ease,background .16s ease;}
.sact:hover{border-color:var(--accent);}
.sact .ico{width:20px;text-align:center;color:var(--muted);font-size:15px;flex:none;}
.sact.danger{color:var(--off);}
.sact .tail{margin-inline-start:auto;font-size:12px;color:var(--muted);}

.imgs-grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));}
.imgtile{position:relative;aspect-ratio:1;border-radius:10px;background:var(--surface-2) center/cover no-repeat;
  border:2px solid transparent;cursor:pointer;overflow:hidden;}
.imgtile.main{border-color:var(--accent);}
.imgtile .tag{position:absolute;inset-inline:4px;bottom:4px;text-align:center;
  font-family:"Jost",sans-serif;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--accent);color:var(--ground);border-radius:5px;padding:2px 0;display:none;}
.imgtile.main .tag{display:block;}
.imgtile .rm{position:absolute;top:4px;inset-inline-end:4px;width:22px;height:22px;border-radius:50%;
  background:color-mix(in srgb,#141008 60%,transparent);color:#F7F1E8;border:0;cursor:pointer;
  display:grid;place-items:center;font-size:13px;line-height:1;padding:0;}
.lib-grid{display:grid;gap:7px;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));}
.libtile{aspect-ratio:1;border-radius:8px;background:var(--surface-2) center/cover no-repeat;
  border:1px solid var(--line);cursor:pointer;position:relative;}
.libtile.used{opacity:.4;}
.libtile:hover{border-color:var(--accent);}

.statusbar{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);
  background:var(--warn-bg,#F4E8D2);border:1px solid color-mix(in srgb,var(--warn,#9A6B20) 30%,transparent);
  border-radius:10px;padding:9px 13px;line-height:1.6;}
.statusbar b{color:var(--ink);font-weight:600;}
.statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--warn,#9A6B20);flex:none;}
.statusbar.good{background:var(--ok-bg,#E3E9DC);border-color:color-mix(in srgb,var(--ok) 30%,transparent);}
.statusbar.good .dot{background:var(--ok);}
.rowline{display:grid;grid-template-columns:1fr 92px auto auto;gap:7px;align-items:center;margin-bottom:8px;}
.rowline input[type=text],.rowline input[type=number]{width:100%;font-family:inherit;font-size:14px;
  color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
.rowline .chk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap;cursor:pointer;}
.rowline .chk input{width:16px;height:16px;accent-color:var(--accent);}
@media (max-width:520px){
  .rowline{grid-template-columns:1fr 84px auto;}
  .rowline .chk{grid-column:1 / -2;}
  .rowline .xbtn{grid-row:2;}
}
.statusbar.perm{background:var(--crit-bg,#F4DFD8);border-color:color-mix(in srgb,var(--off) 30%,transparent);}
.statusbar.perm .dot{background:var(--off);}
/* ---------- وضع الصيانة ---------- */
.maintpage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:48px 26px;max-width:560px;margin:0 auto;}
.maintlogo{width:min(232px,58vw);aspect-ratio:3.771;background-color:var(--ink);opacity:1;
  border:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-mask:var(--logo-src) center/contain no-repeat;mask:var(--logo-src) center/contain no-repeat;}
.maintpage h1{font-size:clamp(21px,5.4vw,28px);font-weight:600;color:var(--ink);line-height:1.45;margin:0;}
.maintpage p{font-size:15px;color:var(--ink-2);line-height:1.85;margin:0;max-width:44ch;}
.maintlinks{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:4px;}
.maintlang{margin-top:10px;}
.maintbar{display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--ground);background:var(--off);
  padding:8px 14px;line-height:1.6;border:0;width:100%;}
.maintbar .dot{width:7px;height:7px;border-radius:50%;background:var(--ground);flex:none;}
.maintstate{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);
  background:var(--ok-bg,#E3E9DC);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);
  border-radius:10px;padding:9px 13px;margin-bottom:12px;}
.maintstate .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;}
.maintstate.off{background:var(--crit-bg,#F4DFD8);border-color:color-mix(in srgb,var(--off) 30%,transparent);}
.maintstate.off .dot{background:var(--off);}
.med-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:4px;}
.medtile{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper-2,#F4F1EB);}
.medimg{aspect-ratio:1;background-size:cover;background-position:center;}
.medmeta{padding:7px 8px;display:flex;flex-direction:column;gap:3px;}
.medname{font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.medtag{font-size:10px;color:var(--ink-2);opacity:.75;}
.medtag.on{color:var(--ok);opacity:1;}
.medtag.ok{color:var(--ok);opacity:1;}
.medrm{position:absolute;top:6px;inset-inline-end:6px;width:24px;height:24px;border-radius:50%;
  border:none;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1;cursor:pointer;}
.qsbox{margin:10px 0 0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper-2,#F4F1EB);font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--ink-2);white-space:pre;overflow-x:auto;}
a.bigbtn{display:block;text-align:center;text-decoration:none;}
.bigbtn.danger{background:var(--off);border-color:var(--off);color:var(--ground);}
.ptab.warn{border-color:var(--off);color:var(--off);}
.ptab.warn.on{background:var(--off);border-color:var(--off);color:var(--ground);}
.snoozechip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;line-height:1.7;
  color:var(--warn,#9A6B20);border:1px solid currentColor;border-radius:100px;padding:1px 8px;white-space:nowrap;}
.snoozechip.perm{color:var(--off);}
.card.out .ph::after{white-space:pre-line;}

.fieldrow{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--ground);
  border:1px solid var(--line-soft);border-radius:11px;}
.fieldrow.off{opacity:.55;}
.fieldrow .fm{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;}
.fieldrow .fm b{font-size:14px;font-weight:600;}
.fieldrow .fm span{font-size:11.5px;color:var(--muted);}
.tagpill{font-family:"Jost",sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:100px;padding:1px 8px;white-space:nowrap;color:var(--muted);}
.tagpill.sales{color:var(--accent);}
.scanbox{display:flex;flex-direction:column;gap:11px;}
.scanpreview{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--ground);
  border:1px solid var(--line-soft);border-radius:11px;}
.scanpreview .th{width:56px;height:56px;border-radius:8px;background:var(--surface-2) center/cover no-repeat;flex:none;}
.scanpreview .m{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.scanpreview .m b{font-size:13.5px;font-weight:600;}
.scanpreview .m span{font-size:11.5px;color:var(--muted);}

/* ---------- admin item manager ---------- */
.mgr{display:flex;flex-direction:column;gap:12px;}
.mgr-filters{display:flex;gap:7px;flex-wrap:wrap;}
.mgr-row{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;
  padding:9px 11px;background:var(--ground);border:1px solid var(--line-soft);border-radius:11px;}
.mgr-row .thumb{position:relative;width:60px;height:60px;border-radius:9px;
  background:var(--surface-2) center/cover no-repeat;overflow:hidden;}
.mgr-row .thumb .dots{display:grid;width:24px;height:24px;font-size:13px;top:4px;inset-inline-end:4px;}
.mgr-row .meta{display:flex;flex-direction:column;gap:1px;min-width:0;}
.mgr-row .meta b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mgr-row .meta span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mgr-row .price{font-family:"Jost",sans-serif;font-weight:500;font-size:15px;
  font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap;}
.mgr-row.hidden-item{opacity:.5;}
.mgr-cat{font-size:13px;font-weight:600;color:var(--muted);padding-top:8px;}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(14px);
  transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1);}
.reveal.in{opacity:1;transform:none;}

/* ---------- category strip ---------- */
nav.cats{position:sticky;top:var(--topnav-h);z-index:30;height:var(--catnav-h);
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);}
nav.cats .scroller{display:flex;gap:clamp(15px,4vw,24px);overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;max-width:1040px;margin:0 auto;height:100%;align-items:center;
  padding:0 clamp(16px,4vw,28px);}
nav.cats .scroller::-webkit-scrollbar{display:none;}
nav.cats button{white-space:nowrap;background:none;border:0;padding:3px 0;cursor:pointer;
  font-family:inherit;color:var(--muted);font-size:13px;font-weight:500;
  border-bottom:1.5px solid transparent;transition:color .2s ease,border-color .2s ease;
  -webkit-tap-highlight-color:transparent;}
nav.cats button:hover{color:var(--ink);}
nav.cats button.current{color:var(--ink);border-bottom-color:var(--accent);}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;gap:clamp(30px,6vw,52px);padding-top:clamp(26px,6vw,44px);}
.about{display:flex;flex-direction:column;gap:11px;max-width:66ch;}
.eyebrow{font-family:"Jost",sans-serif;font-weight:400;font-size:10px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--muted);direction:ltr;}
:root[dir="rtl"] .eyebrow{text-align:right;}
.about h2{margin:0;font-size:clamp(19px,4.2vw,25px);font-weight:600;line-height:1.4;}
.about p{margin:0;font-size:clamp(14px,3.2vw,16px);color:var(--ink-2);line-height:1.85;}

.points{display:grid;gap:clamp(11px,2.4vw,16px);
  grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));}
.point{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;display:flex;flex-direction:column;gap:5px;}
.point h3{margin:0;font-size:15px;font-weight:600;}
.point p{margin:0;font-size:13px;color:var(--muted);line-height:1.65;}

.strip{display:grid;gap:clamp(9px,2vw,14px);
  grid-template-columns:repeat(auto-fill,minmax(min(140px,45%),1fr));}
.strip.wide{grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));}
.strip.wide .ph{aspect-ratio:4/3;border-radius:14px;}
.lb-img.wide{aspect-ratio:4/3;}
.lb-img.up{background-size:cover;background-position:center;}
.lb-vid{width:min(620px,100%);max-height:100%;border-radius:16px;background:#000;display:block;}
.ph.up,.imgtile.up,.thumb.up{background-size:cover;background-position:center;background-repeat:no-repeat;}
.ph.up.vid::after,.imgtile.up.vid::after,.thumb.up.vid::after{content:"";position:absolute;inset:0;margin:auto;
  width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75);}
.ph.up.vid::before,.imgtile.up.vid::before,.thumb.up.vid::before{content:"";position:absolute;inset:0;margin:auto;z-index:2;
  width:0;height:0;border-style:solid;border-width:8px 0 8px 13px;
  border-color:transparent transparent transparent #fff;transform:translateX(2px);}
.vidtag{position:absolute;inset-inline-start:6px;top:6px;z-index:3;font-size:9.5px;letter-spacing:.05em;
  text-transform:uppercase;color:#fff;background:rgba(0,0,0,.5);border-radius:100px;padding:2px 7px;}
/* ---------- الطلب أونلاين ---------- */
.addbtn{margin-inline-start:auto;font-family:inherit;font-size:12px;font-weight:600;line-height:1;
  color:var(--ground);background:var(--ink);border:1px solid var(--ink);border-radius:100px;
  padding:7px 12px;cursor:pointer;white-space:nowrap;transition:transform .15s,opacity .2s;}
.addbtn:hover{opacity:.86;}
.addbtn:active{transform:scale(.95);}
.addbtn.on{background:var(--accent);border-color:var(--accent);}
.cartbar{position:fixed;inset-inline:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:10px;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--ground);background:var(--ink);
  border:0;border-radius:100px;padding:13px 18px;cursor:pointer;
  box-shadow:0 8px 26px rgba(0,0,0,.22);max-width:520px;margin-inline:auto;}
.cartbar .n{min-width:23px;height:23px;border-radius:100px;background:var(--ground);color:var(--ink);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.cartbar .l{flex:1;text-align:start;}
.cartbar .v{font-variant-numeric:tabular-nums;font-weight:600;}
.cartbar .v i{font-style:normal;font-size:11px;opacity:.72;}
.cartlines{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;}
.cline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.cline:last-child{border-bottom:0;}
.cline .cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.cline .cm b{font-size:14px;font-weight:600;color:var(--ink);}
.cline .cm span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.cline .lt{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:52px;text-align:end;}
.qbox{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:100px;padding:2px;}
.qb{width:28px;height:28px;border-radius:100px;border:0;background:transparent;color:var(--ink);
  font-family:inherit;font-size:15px;line-height:1;cursor:pointer;}
.qb:hover{background:var(--surface-2);}
.qbox .q{min-width:22px;text-align:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;}
.chrow{display:flex;gap:8px;margin-bottom:12px;}
.chbtn{flex:1;font-family:inherit;font-size:13px;color:var(--ink-2);background:transparent;
  border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;}
.chbtn.on{background:var(--ink);border-color:var(--ink);color:var(--ground);}
.totrow{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;
  font-size:13px;color:var(--ink-2);}
.totrow b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
.totrow.grand{border-top:1px solid var(--line);margin-top:5px;padding-top:10px;font-size:15px;color:var(--ink);}
.totrow.grand b{font-size:17px;}
.ordone{text-align:center;padding:14px 0 6px;display:flex;flex-direction:column;gap:8px;align-items:center;}
.oref{font-size:30px;font-weight:600;letter-spacing:.12em;color:var(--ink);
  background:var(--surface-2);border-radius:12px;padding:12px 22px;font-variant-numeric:tabular-nums;}
.ordrow .tagpill.sales{background:var(--ink);color:var(--ground);border-color:var(--ink);}
@media (max-width:420px){ .cline{flex-wrap:wrap;} .cline .lt{min-width:0;} }
a.bigbtn.dl{display:block;text-align:center;text-decoration:none;line-height:normal;}
.uprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.uprow .bigbtn{flex:1 1 150px;margin:0;}

.info{display:grid;gap:clamp(11px,2.4vw,16px);
  grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));}
.info .cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;display:flex;flex-direction:column;gap:3px;}
.info .k{font-family:"Jost",sans-serif;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);direction:ltr;}
:root[dir="rtl"] .info .k{text-align:right;}
.info .v{font-size:14.5px;font-weight:500;line-height:1.6;overflow-wrap:anywhere;}
.info .v.ltr{direction:ltr;font-variant-numeric:tabular-nums;}
:root[dir="rtl"] .info .v.ltr{text-align:right;}

/* ---------- menu sections ---------- */
section.cat{padding:clamp(26px,6vw,44px) 0 0;scroll-margin-top:calc(var(--topnav-h) + var(--catnav-h) + 10px);}
.cat-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 10px;margin-bottom:clamp(12px,2.5vw,18px);}
.cat-head .titles{display:flex;flex-direction:column;gap:0;}
.cat-head h2{font-weight:600;font-size:clamp(17px,3.6vw,21px);margin:0;line-height:1.4;}
.cat-head .en-sub{font-family:"Jost",sans-serif;font-weight:300;font-size:9.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--muted);direction:ltr;}
:root[data-lang="en"] .cat-head h2{font-family:"Jost",sans-serif;font-weight:400;
  letter-spacing:.16em;text-transform:uppercase;font-size:clamp(13px,3vw,15px);}
.ambadge{font-size:11px;color:var(--accent);border:1px solid currentColor;border-radius:100px;
  padding:2px 10px;white-space:nowrap;line-height:1.6;}
.ambadge .hrs{font-variant-numeric:tabular-nums;}
section.cat.asleep{opacity:.5;}

.grid{display:grid;gap:clamp(12px,2.6vw,20px);
  grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));}
@media (min-width:560px){ .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));} }

.card{display:flex;flex-direction:column;gap:9px;min-width:0;}
.ph{width:100%;aspect-ratio:1;border-radius:12px;background:var(--surface-2) center/cover no-repeat;
  position:relative;overflow:hidden;cursor:zoom-in;border:0;padding:0;display:block;
  transition:transform .35s cubic-bezier(.2,.7,.3,1);-webkit-tap-highlight-color:transparent;}
@media (hover:hover){ .card:hover .ph,.strip .ph:hover{transform:scale(1.018);} }
.ph.cup{background-image:var(--ph-cup);}
.ph.latte{background-image:var(--ph-latte);}
.ph.cookie{background-image:var(--ph-cookie);}
.ph.cake{background-image:var(--ph-cake);}
.ph.crois{background-image:var(--ph-crois);}
.ph.twist{background-image:var(--ph-twist);}
.ph.int1{background-image:var(--ph-int1);}
.ph.int2{background-image:var(--ph-int2);}
.ph.int3{background-image:var(--ph-int3);}
.ph.int4{background-image:var(--ph-int4);}
.ph.pistachio{background-image:var(--ph-pistachio);}
.ph.slice{background-image:var(--ph-slice);}
.ph.smatcha{background-image:var(--ph-smatcha);}
.ph.hotchoc{background-image:var(--ph-hotchoc);}
.ph.berryswirl{background-image:var(--ph-berryswirl);}
.ph.flatwhite{background-image:var(--ph-flatwhite);}
.ph.softberry{background-image:var(--ph-softberry);}
.ph.biscoff{background-image:var(--ph-biscoff);}
.ph.berrycup{background-image:var(--ph-berrycup);}
.ph.beans{background-image:var(--ph-beans);}
.ph.mango{background-image:var(--ph-mango);}
.ph.caramel{background-image:var(--ph-caramel);}
.ph.matchafrappe{background-image:var(--ph-matchafrappe);}
.card-body{display:flex;flex-direction:column;gap:3px;}
.nm{font-size:clamp(13.5px,3vw,15px);font-weight:600;line-height:1.45;overflow-wrap:anywhere;}
.desc{font-size:clamp(11px,2.5vw,12.5px);color:var(--muted);line-height:1.55;}
.pr{font-family:"Jost",sans-serif;font-weight:500;font-size:clamp(15px,3.5vw,17px);
  font-variant-numeric:tabular-nums;direction:ltr;text-align:start;margin-top:4px;color:var(--ink);}
.pr .cur{font-weight:400;font-size:.62em;letter-spacing:.16em;color:var(--muted);
  margin-inline-start:5px;text-transform:uppercase;}

.card.out .ph{filter:grayscale(.85) opacity(.55);}
.card.out .nm,.card.out .desc,.card.out .pr{opacity:.45;}
.card.out .ph::after{
  content:attr(data-outlabel);position:absolute;inset-inline:8px;bottom:8px;
  font-family:"Jost",sans-serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  text-align:center;padding:4px 0;border-radius:6px;
  background:var(--ground);color:var(--off);border:1px solid currentColor;}

footer.foot{text-align:center;padding:clamp(42px,8vw,64px) 0 8px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:12px;}
footer.foot span{font-family:"Jost",sans-serif;font-weight:300;font-size:10px;
  letter-spacing:.34em;text-transform:uppercase;direction:ltr;padding-inline-start:.34em;}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:90;display:none;
  background:color-mix(in srgb,var(--ground) 94%,#000);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.lb.on{display:flex;flex-direction:column;}
.lb-bar{display:flex;align-items:center;gap:10px;padding:12px clamp(12px,4vw,22px);}
.lb-count{font-family:"Jost",sans-serif;font-size:11.5px;letter-spacing:.16em;color:var(--muted);
  direction:ltr;font-variant-numeric:tabular-nums;}
.lb-x{margin-inline-start:auto;width:40px;height:40px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;
  -webkit-tap-highlight-color:transparent;}
.lb-x:hover{border-color:var(--ink-2);}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;
  padding:0 clamp(10px,3vw,20px);min-height:0;position:relative;}
.lb-img{width:min(620px,100%);max-height:100%;aspect-ratio:1;border-radius:16px;
  background:var(--surface-2) center/cover no-repeat;box-shadow:0 18px 50px rgba(0,0,0,.22);}
.lb-img.cup{background-image:var(--ph-cup);}
.lb-img.latte{background-image:var(--ph-latte);}
.lb-img.cookie{background-image:var(--ph-cookie);}
.lb-img.cake{background-image:var(--ph-cake);}
.lb-img.crois{background-image:var(--ph-crois);}
.lb-img.twist{background-image:var(--ph-twist);}
.lb-img.int1{background-image:var(--ph-int1);}
.lb-img.int2{background-image:var(--ph-int2);}
.lb-img.int3{background-image:var(--ph-int3);}
.lb-img.int4{background-image:var(--ph-int4);}
.lb-img.pistachio{background-image:var(--ph-pistachio);}
.lb-img.slice{background-image:var(--ph-slice);}
.lb-img.smatcha{background-image:var(--ph-smatcha);}
.lb-img.hotchoc{background-image:var(--ph-hotchoc);}
.lb-img.berryswirl{background-image:var(--ph-berryswirl);}
.lb-img.flatwhite{background-image:var(--ph-flatwhite);}
.lb-img.softberry{background-image:var(--ph-softberry);}
.lb-img.biscoff{background-image:var(--ph-biscoff);}
.lb-img.berrycup{background-image:var(--ph-berrycup);}
.lb-img.beans{background-image:var(--ph-beans);}
.lb-img.mango{background-image:var(--ph-mango);}
.lb-img.caramel{background-image:var(--ph-caramel);}
.lb-img.matchafrappe{background-image:var(--ph-matchafrappe);}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent;}
.lb-nav:hover{border-color:var(--ink-2);}
.lb-nav.prev{inset-inline-start:clamp(6px,2vw,18px);}
.lb-nav.next{inset-inline-end:clamp(6px,2vw,18px);}
.lb-cap{padding:16px clamp(16px,4vw,24px) calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;}
.lb-cap h3{margin:0;font-size:clamp(16px,4vw,19px);font-weight:600;}
.lb-cap p{margin:0;font-size:clamp(12.5px,3vw,14px);color:var(--muted);max-width:46ch;line-height:1.6;}
.lb-cap .pr{margin-top:6px;font-size:clamp(16px,4vw,19px);text-align:center;}

/* ---------- admin ---------- */
.adminbar{position:fixed;inset-inline:0;bottom:0;z-index:60;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
.adminbar .status{font-size:12px;color:var(--muted);min-width:92px;text-align:center;}
.adminbar .status.ok{color:var(--ok);}
.adminbar .status.err{color:var(--off);}
.btn{font-family:inherit;font-size:12.5px;cursor:pointer;line-height:1.6;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:6px 14px;transition:border-color .16s ease;-webkit-tap-highlight-color:transparent;}
.btn:hover{border-color:var(--ink-2);}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink);}
.btn.primary:disabled{opacity:.4;cursor:default;}
.btn.tiny{font-size:11px;padding:3px 8px;border-radius:5px;}
.btn.danger{color:var(--off);}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--ground);}

body.editing [contenteditable]{border-radius:5px;padding:1px 6px;margin-inline-start:-6px;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-soft);}
body.editing [contenteditable]:focus{box-shadow:inset 0 0 0 1px var(--accent);outline:none;}
body.editing .ph{cursor:default;}
.itemtools{display:none;gap:5px;flex-wrap:wrap;margin-top:6px;}
body.editing .itemtools{display:flex;}
.cattools{display:none;gap:6px;margin:16px 0 0;flex-wrap:wrap;}
body.editing .cattools{display:flex;}
.addcat{display:none;margin:30px 0 0;}
body.editing .addcat{display:block;}
.pr-edit{display:none;}
body.editing .pr .pr-view{display:none;}
body.editing .pr .pr-edit{display:inline;}

.qrpanel{display:none;margin:clamp(30px,6vw,44px) 0 0;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:24px;
  flex-direction:column;align-items:center;gap:13px;text-align:center;}
body.editing .qrpanel{display:flex;}
.qrpanel img{width:min(184px,60vw);height:auto;image-rendering:pixelated;
  border-radius:6px;background:#fff;padding:10px;}
.qrpanel p{margin:0;font-size:12.5px;color:var(--muted);max-width:42ch;line-height:1.65;}
.qrpanel h3{margin:0;font-size:14.5px;font-weight:600;}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;}
  html{scroll-behavior:auto;}
  .reveal{opacity:1;transform:none;}
  .hero-bg{transform:none;}
}

  function b64(buf){

  var remoteMaint = null, remoteTxt = null, statusTimer = null;

  function statusURL(){
    var p = location.pathname.replace(/[^\/]*$/, "");
    return p + "status.json?t=" + Date.now();

  function applyStatus(j){
    var before = maintOn();
    if(j && typeof j === "object"){
      if(typeof j.maint === "boolean") remoteMaint = j.maint;
      remoteTxt = (j.title || j.body) ? j : null;
    }
    if(maintOn() !== before) rerenderAll();
  }
  function loadStatus(){
    if(!/^https?:$/.test(location.protocol)) return;
    if(typeof fetch !== "function") return;
    try{
      fetch(statusURL(), {cache:"no-store"})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(applyStatus)
        .catch(function(){});
    }catch(err){}
  }
  function watchStatus(){
    loadStatus();
    if(statusTimer) clearInterval(statusTimer);
    statusTimer = setInterval(loadStatus, 60000);
    // ولما يرجع للتبويب نتحقق فوراً بدل ما ينتظر الدقيقة
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) loadStatus();
    });
  }

  function esc(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")

  }
  // أي رابط ندخله في url(...) — نتأكد إنه data: أو blob: ونقتبسه
  function safeURL(u){
    u = String(u == null ? "" : u);
    // ملف صورة جنب الصفحة — images/uploads/u_xxxx.jpg
    if(/^images\/(?:[A-Za-z0-9_-]{1,32}\/)?[A-Za-z0-9_][A-Za-z0-9_\-.]{0,80}\.(jpg|jpeg|png|webp|mp4)$/i.test(u)) return "'" + u + "'";
    if(!/^(data:|blob:)/i.test(u)) return "";
    return "'" + u.replace(/['"\\()\s]/g, "") + "'";
  }

  function renderSheet(){
    var host = document.getElementById("sheetHost");

    host.innerHTML = sheetHTML(lang);
    document.body.classList.toggle("lb-open", !!sheet);

  function sheetAction(act, el){
    var f = findItemAnywhere(sheet.itemId);
    if(!f){ closeSheet(); return; }
    var it=f.item, cat=f.cat;
    if(act==="close"){ closeSheet(); return; }
    if(act==="back"){ sheet.mode="acts"; renderSheet(); return; }
    if(act==="edit"){ sheet.mode="edit"; renderSheet(); return; }
    if(act==="images"){ sheet.mode="images"; renderSheet(); return; }
    if(act==="toggle"){ if(!isOwner()) return; it.out=!it.out; if(it.out) clearSnooze(it); touch(); rerenderAll(); return; }
    if(act==="snooze"){ sheet.mode="snooze"; renderSheet(); return; }
    if(act==="unsnooze"){
      clearSnooze(it); touch(); closeSheet(); render();
      toast(nameOf(it) + " · " + T[lang].showItem); return;
    }
    if(act==="dosnooze"){
      var d = el.dataset.d, ms;
      if(d === "day"){
        var end = new Date(); end.setHours(23,59,59,999);
        ms = Math.max(60000, end.getTime() - Date.now());
      } else { ms = parseInt(d,10) * 3600000; }
      setSnooze(it, ms);
      var msg = nameOf(it) + " · " + T[lang].backIn + " " + leftLabel(snoozeLeft(it), lang);
      touch(); closeSheet(); render(); toast(msg);
      return;
    }
    if((act==="up" || act==="down") && !isOwner()) return;
    if(act==="up" || act==="down"){
      var arr=cat.items, i=arr.indexOf(it), j=act==="up"?i-1:i+1;
      if(j>=0 && j<arr.length){ arr[i]=arr[j]; arr[j]=it; touch(); rerenderAll(); }
      return;
    }
    if(act==="del"){
      if(!isOwner()) return;
      if(!window.confirm(T[lang].confirmDel + "\n" + nameOf(it))) return;
      cat.items = cat.items.filter(function(x){ return x.id!==it.id; });
      touch(); closeSheet(); render(); return;
    }
    if(act==="saveitem"){
      if(!isOwner()) return;
      it.ar  = (document.getElementById("fAr").value||"").trim() || it.ar;
      it.en  = (document.getElementById("fEn").value||"").trim() || it.en;
      it.dar = (document.getElementById("fDAr").value||"").trim();
      it.den = (document.getElementById("fDEn").value||"").trim();
      var np = parseFloat(document.getElementById("fP").value);
      if(!isNaN(np) && np>=0) it.p = np;
      var newCat = document.getElementById("fC").value;
      if(newCat !== cat.id){
        cat.items = cat.items.filter(function(x){ return x.id!==it.id; });
        for(var i=0;i<DATA.cats.length;i++){ if(DATA.cats[i].id===newCat){ DATA.cats[i].items.push(it); break; } }
      }
      touch(); sheet.mode="acts"; render(); renderSheet(); return;
    }
    if(act==="setmain"){
      if(!isOwner()) return;
      var idx=parseInt(el.dataset.i,10);
      if(idx>0){ var k=it.imgs.splice(idx,1)[0]; it.imgs.unshift(k); touch(); rerenderAll(); }
      return;
    }
    if(act==="rmimg"){
      if(!isOwner()) return;
      var ri=parseInt(el.dataset.i,10);
      if(it.imgs.length>1){ it.imgs.splice(ri,1); touch(); rerenderAll(); }  // الصورة تبقى في المكتبة
      return;
    }
    if(act==="addimg"){
      if(!isOwner()) return;
      var key=el.dataset.k;
      if(it.imgs.indexOf(key)<0){ it.imgs.push(key); touch(); rerenderAll(); }
      return;
    }
    if(act==="pickimg"){ var fi=document.getElementById("upfile"); if(fi) fi.click(); return; }
    if(act==="pickvid"){ var fv=document.getElementById("upvid"); if(fv) fv.click(); return; }
  }

  /* ---------- رفع الصور والفيديو ---------- */
  var MAX_EDGE = 1400, IMG_SM = 600, JPEG_Q = 0.72, JPEG_Q_SM = 0.68, MAX_VID = 6*1024*1024;
  function newMediaKey(){ return UP_PREFIX + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function resizeTo(im, edge, q){
    var w = im.naturalWidth || im.width, hgt = im.naturalHeight || im.height;
    var sc = Math.min(1, edge / Math.max(w, hgt));
    var cw = Math.max(1, Math.round(w*sc)), ch = Math.max(1, Math.round(hgt*sc));
    var cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    var cx = cv.getContext("2d");
    cx.fillStyle = "#fff"; cx.fillRect(0,0,cw,ch);      // عسب PNG الشفاف ما يطلع أسود
    cx.imageSmoothingQuality = "high";
    cx.drawImage(im, 0, 0, cw, ch);
    return {url: cv.toDataURL("image/jpeg", q), w:cw, h:ch};
  }

  // كل صورة تنحفظ بمقاسين: صغيرة للبطاقة وواضحة للعرض
  function shrinkImage(file, done){
    var rd = new FileReader();
    rd.onload = function(){
      var im = new Image();
      im.onload = function(){
        try{
          var lg = resizeTo(im, MAX_EDGE, JPEG_Q);
          var sm = resizeTo(im, IMG_SM, JPEG_Q_SM);
          done({kind:"image", lg:lg.url, sm:sm.url, w:lg.w, h:lg.h, name:file.name});
        }catch(e){
          done({kind:"image", lg:rd.result, sm:rd.result, name:file.name});
        }
      };
      im.onerror = function(){ done(null); };
      im.src = rd.result;
    };
    rd.onerror = function(){ done(null); };
    rd.readAsDataURL(file);
  }

  // أول كادر من الفيديو يصير صورة الغلاف
  function videoPoster(src, done){
    var v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "metadata";
    var fired = false;
    var grab = function(){
      if(fired) return; fired = true;
      try{
        var sc = Math.min(1, MAX_EDGE / Math.max(v.videoWidth||1, v.videoHeight||1));
        var cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round((v.videoWidth||640)*sc));
        cv.height = Math.max(1, Math.round((v.videoHeight||360)*sc));
        cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
        done(cv.toDataURL("image/jpeg", JPEG_Q));
      }catch(e){ done(""); }
    };
    v.onloadeddata = function(){ try{ v.currentTime = 0.1; }catch(e){ grab(); } };
    v.onseeked = grab;
    v.onerror = function(){ if(!fired){ fired = true; done(""); } };
    setTimeout(function(){ if(!fired){ fired = true; done(""); } }, 3000);
    v.src = src;
  }

  function attachMedia(m){
    if(!sheet) return;
    var f = findItemAnywhere(sheet.itemId); if(!f) return;
    var key = newMediaKey();
    if(!DATA.media) DATA.media = {};
    DATA.media[key] = m;
    f.item.imgs.push(key);
    touch(); rerenderAll();
    toast(T[lang].upDone + (m.kind === "video" ? " — " + T[lang].upVidNote : ""));
  }

  function handleUpload(files, wantVideo){
    if(!isOwner() || !files || !files.length) return;
    var list = Array.prototype.slice.call(files, 0, wantVideo ? 1 : 8);
    list.forEach(function(file){
      if(wantVideo){
        if(file.type.indexOf("video/") !== 0){ toast(T[lang].upBad); return; }
        if(file.size > MAX_VID){ toast(T[lang].upTooBig); return; }
        var rv = new FileReader();
        rv.onload = function(){
          videoPoster(rv.result, function(poster){
            attachMedia({src:rv.result, kind:"video", poster:poster, name:file.name, bytes:file.size});
          });
        };
        rv.readAsDataURL(file);
      } else {
        if(file.type.indexOf("image/") !== 0){ toast(T[lang].upBad); return; }
        shrinkImage(file, function(m){ if(m) attachMedia(m); else toast(T[lang].upBad); });
      }
    });
  }

  /* ---------- lightbox ---------- */
  var gStarts = [];
  function buildGallery(){
    gallery = []; gStarts = [];
    [].slice.call(document.querySelectorAll('[data-act="zoom"]')).forEach(function(b){
      gStarts.push(gallery.length);
      var keys = (b.dataset.imgs || b.dataset.img || "cup").split(",").filter(Boolean);
      keys.forEach(function(k, i){
        gallery.push({ img:k, title:b.dataset.title, wide:b.dataset.wide === "1",
                       desc:b.dataset.desc || "", price:b.dataset.price || "",
                       n:i+1, of:keys.length });
      });
    });
  }
  function openLB(btn){
    var all = [].slice.call(document.querySelectorAll('[data-act="zoom"]'));
    buildGallery();
    lbIndex = gStarts[Math.max(0, all.indexOf(btn))] || 0;
    showLB();
    document.getElementById("lb").classList.add("on");
    document.body.classList.add("lb-open");
  }
  function showLB(){
    var g = gallery[lbIndex]; if(!g) return;
    var lb = document.getElementById("lb"), img = document.getElementById("lbimg");
    var vid = document.getElementById("lbvid");
    var key = g.img || "cup", m = media(key);
    if(vid){
      if(m && m.kind === "video"){
        img.hidden = true;
        vid.hidden = false;
        var vsrc = pic(key, true);
        if(vid.getAttribute("src") !== vsrc) vid.src = vsrc;
        vid.setAttribute("aria-label", g.title);
      } else {
        vid.hidden = true;
        vid.removeAttribute("src");
        try{ vid.load(); }catch(e){}
        img.hidden = false;
      }
    }
    img.className = "lb-img " + phClass(key) + (g.wide ? " wide" : "");
    // اللي ينفتح للزبون هو النسخة الواضحة، مب صورة البطاقة الصغيرة
    var big = (isUp(key) && m && m.kind !== "video") ? safeURL(pic(key, true)) : "";
    img.style.backgroundImage = big ? ("url(" + big + ")") : "";
    img.setAttribute("aria-label", g.title);
    lb.querySelector(".lb-cap h3").textContent = g.title;
    var p = lb.querySelector(".lb-cap p");
    p.textContent = g.desc; p.hidden = !g.desc;
    var pr = lb.querySelector(".lb-cap .pr");
    pr.innerHTML = g.price ? ('<span>' + esc(g.price) + '</span><span class="cur">' + esc(DATA.cur[lang]) + '</span>') : "";
    lb.querySelector(".lb-count").textContent =
      (g.of > 1 ? (g.n + " / " + g.of + "  ·  ") : "") + (lbIndex+1) + " / " + gallery.length;
  }
  function stepLB(n){
    if(!gallery.length) return;
    lbIndex = (lbIndex + n + gallery.length) % gallery.length;
    showLB();
  }
  function closeLB(){
    var lb = document.getElementById("lb");
    var vd = document.getElementById("lbvid");
    if(vd){ try{ vd.pause(); }catch(e){} }
    if(lb) lb.classList.remove("on");
    document.body.classList.remove("lb-open");
  }
  function lbOpen(){
    var lb = document.getElementById("lb");
    return lb && lb.classList.contains("on");
  }

  document.addEventListener("change", function(e){
    if(e.target && e.target.id && e.target.id.indexOf("x_") === 0 && e.target.type === "checkbox" && draft){
      draft.extra[e.target.id.slice(2)] = e.target.checked; updateRepCalc(); return;
    }
    if(e.target && /^e_c_/.test(e.target.id) && draft){
      var i = parseInt(e.target.id.split("_")[2],10);
      if(draft.exp[i]) draft.exp[i].c = e.target.checked;
      updateRepCalc(); return;
    }
    if(e.target && e.target.id === "scanfile"){
      var sfl = e.target.files && e.target.files[0];
      e.target.value = "";
      attachScan(sfl);
      return;
    }
    if(e.target && e.target.id === "invfile"){
      var f = e.target.files && e.target.files[0];
      e.target.value = "";
      addInvoiceFile(f);
      return;
    }
    // رفع جماعي في المكتبة — بدون ما نفتح كل صنف
    if(e.target && e.target.id === "medfiles"){
      var mfl = e.target.files || [];
      if(!mfl.length) return;
      var left = mfl.length, added = 0;
      toast(T[lang].bundleBuilding);
      Array.prototype.forEach.call(mfl, function(file){
        if(!/^image\//.test(file.type)){ if(--left === 0) finishMed(); return; }
        shrinkImage(file, function(m){
          if(m){
            if(!DATA.media) DATA.media = {};
            DATA.media[newMediaKey()] = m;
            added++;
          }
          if(--left === 0) finishMed();
        });
      });
      function finishMed(){
        if(added){ touch(); rerenderAll(); toast(added + " " + T[lang].bundleImgs + " — " + T[lang].upDone); }
        else toast(T[lang].upBad);
      }
      e.target.value = "";
      return;
    }
    // حزمة معدّلة
    if(e.target && e.target.id === "bundlefile"){
      var zf = (e.target.files || [])[0];
      e.target.value = "";
      if(!zf) return;
      toast(T[lang].bundleBuilding);
      zf.arrayBuffer().then(function(ab){
        zipRead(ab, function(map){
          if(!map){ toast(T[lang].bundleBad); return; }
          applyBundle(map, function(rep){
            if(!rep.rows && !rep.imgs){ toast(T[lang].bundleBad); return; }
            gcMediaKeepLibrary();
            touch(); rerenderAll();
            toast(rep.rows + " " + T[lang].bundleRows + " · " + rep.imgs + " " + T[lang].bundleImgs
                  + " — " + T[lang].bundleApplied);
          });
        });
      }).catch(function(){ toast(T[lang].bundleBad); });
      return;
    }
    if(e.target && (e.target.id === "upfile" || e.target.id === "upvid")){
      var wantVid = e.target.id === "upvid";
      var fl = e.target.files;
      handleUpload(fl, wantVid);
      e.target.value = "";
      return;
    }
  });

  document.addEventListener("keydown", function(e){
    if(sheet && e.key === "Escape"){ closeSheet(); return; }
    if(e.key === "Enter" || e.key === " "){
      var ph = e.target.closest && e.target.closest('.ph[role="button"]');
      if(ph){ e.preventDefault(); if(!editing) openLB(ph); return; }
    }
    if(authOpen && e.key === "Enter"){
      var t2 = e.target;
      if(t2 && (t2.id === "au" || t2.id === "ap")){
        e.preventDefault();
        var btn = document.querySelector('[data-act="dologin"]');
        if(btn) btn.click();
        return;
      }
    }
    if(authOpen && e.key === "Escape"){ authOpen = false; render(); return; }
    if(lbOpen()){
      if(e.key==="Escape"){ closeLB(); return; }
      if(e.key==="ArrowRight"){ stepLB(lang==="ar" ? -1 : 1); return; }
      if(e.key==="ArrowLeft"){ stepLB(lang==="ar" ? 1 : -1); return; }
    }
    if(e.key==="Enter" && e.target.getAttribute && e.target.getAttribute("contenteditable")==="true"){
      e.preventDefault(); e.target.blur();
    }
  });

  var tX = null;
  document.addEventListener("touchstart", function(e){
    if(lbOpen()) tX = e.changedTouches[0].clientX;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(tX === null) return;
    var dx = e.changedTouches[0].clientX - tX; tX = null;
    if(Math.abs(dx) > 45){
      var rtl = lang === "ar";
      stepLB(dx > 0 ? (rtl ? 1 : -1) : (rtl ? -1 : 1));
    }
  }, {passive:true});

  /* ---------- editing ---------- */
  document.addEventListener("input", function(e){
    var el = e.target;
    if(el.id === "q"){ applyFilter(el.value); return; }
    if(el.id && el.id.indexOf("r_") === 0 && draft){
      var key = el.id.slice(2);
      if(key === "date") draft.date = el.value;
      else if(key === "notes") draft.notes = el.value;
      else draft[key] = el.value;
      updateRepCalc(); return;
    }
    if(el.id && el.id.indexOf("x_") === 0 && draft){
      draft.extra[el.id.slice(2)] = (el.type === "checkbox") ? el.checked : el.value;
      updateRepCalc(); return;
    }
    if(el.id && /^[ew]_/.test(el.id) && draft){
      var m = el.id.split("_"), kind = m[0], fld = m[1], idx = parseInt(m[2],10);
      var arr = kind === "e" ? draft.exp : draft.waste;
      if(arr[idx]) arr[idx][fld] = (el.type === "checkbox") ? el.checked : el.value;
      updateRepCalc(); return;
    }
    if(el.id === "mq"){
      mgrQ = el.value;
      var pos = el.selectionStart;
      render();
      var again = document.getElementById("mq");
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(err){} }
      return;
    }
    if(!el.dataset || !el.dataset.f || el.getAttribute("contenteditable")!=="true") return;
    var txt = el.textContent.trim();
    if(el.dataset.f==="home"){ setPath(DATA.home, el.dataset.p, txt); touch(); return; }
    if(el.dataset.f==="loyalty"){ setPath(DATA.loyalty, el.dataset.p, txt); touch(); return; }
    var c = ctx(el);
    if(el.dataset.f==="cat" && c.cat){ c.cat[el.dataset.k] = txt; }
    else if(el.dataset.f==="name" && c.item){ c.item[el.dataset.k] = txt; }
    else if(el.dataset.f==="desc" && c.item){ c.item[el.dataset.k] = txt; }
    else if(el.dataset.f==="price" && c.item){
      var n = parseFloat(txt.replace(/[^\d.]/g,""));
      c.item.p = isNaN(n) ? 0 : n;
    }
    else if((el.dataset.f==="amfrom" || el.dataset.f==="amto") && c.cat && c.cat.am){
      var v = parseInt(txt.replace(/[^\d]/g,""), 10);
      if(!isNaN(v) && v>=0 && v<=23){ c.cat.am[el.dataset.f==="amfrom" ? "from" : "to"] = v; }
    }
    touch();
  });

  document.addEventListener("click", function(e){
    var sEl = e.target.closest("[data-sact]");
    if(sEl){ sheetAction(sEl.dataset.sact, sEl); return; }
    var scrim = document.getElementById("scrim");
    if(scrim && e.target === scrim){ closeSheet(); return; }

    var lbEl = document.getElementById("lb");
    if(lbEl && lbEl.classList.contains("on") && e.target === lbEl){ closeLB(); return; }

    var b = e.target.closest("[data-act]");
    if(!b) return;
    var act = b.dataset.act, c = ctx(b);

    if(act==="authclose"){ authOpen = false; authErr = ""; authMode = "login"; render(); return; }
    if(act==="saveover"){
      saveOverFile().then(function(done){
        if(done){
          dirty = false;
          sheet = null;
          render(); renderSheet();
          toast(T[lang].savedOver);
        }
      });
      return;
    }
    if(act==="docclose"){
      dirty = false;
      sheet = null;
      if(pendingDoc && pendingDoc.url){ URL.revokeObjectURL(pendingDoc.url); pendingDoc = null; }
      render(); renderSheet();
      return;
    }
    if(act==="gatemode"){ authMode = "setgate"; authErr = ""; render(); return; }
    if(act==="gatecancel"){ authMode = "login"; authErr = ""; render(); return; }
    if(act==="setgate"){
      if(gateSet() || !cryptoOK() || gateBusy) return;
      var np = (document.getElementById("ap").value || "");
      var np2 = (document.getElementById("ap2").value || "");
      var errEl = document.getElementById("aerr");
      if(np.length < GATE_MIN){ authErr = T[lang].tooShort; errEl.textContent = authErr; return; }
      if(np !== np2){ authErr = T[lang].noMatch; errEl.textContent = authErr; return; }
      gateBusy = true; authErr = ""; errEl.textContent = T[lang].working;
      var salt = randSalt();
      deriveKey(np, salt, GATE_ITER).then(function(hash){
        var g = gate();
        g.salt = salt; g.hash = hash; g.iter = GATE_ITER;
        gateBusy = false;
        clearFails();
        authErr = ""; authMode = "login";
        session = {u:"tariq", role:"owner"};
        saveSession();
        authOpen = false; isAdmin = true; ptab = "inv"; view = "panel";
        dirty = true;
        render(); window.scrollTo(0,0);
        toast(T[lang].gateSaved);
      }).catch(function(){
        gateBusy = false;
        authErr = T[lang].gateFailed;
        errEl.textContent = authErr;
      });
      return;
    }

    if(act==="dologin"){
      if(gateBusy) return;
      var uEl = document.getElementById("au"), pEl = document.getElementById("ap");
      var uu = (uEl.value || "").trim().toLowerCase();
      var pp = pEl.value || "";
      var aerr = document.getElementById("aerr");
      if(!uu || !pp){ aerr.textContent = T[lang].badlogin; return; }

      var cool = coolLeft();
      if(cool > 0){ aerr.textContent = T[lang].cooling + " " + coolLabel(cool, lang); return; }

      var enter = function(){
        var found = null;
        for(var ui=0; ui<DEMO.users.length; ui++){ if(DEMO.users[ui].u === uu) found = DEMO.users[ui]; }
        if(!found){ found = {u:uu, role:"staff"}; DEMO.users.push(found); saveDemo(); }
        session = {u:found.u, role:found.role};
        saveSession();
        clearFails();
        authErr = "";
        authOpen = false; isAdmin = true; ptab = "inv"; view = "panel";
        render(); window.scrollTo(0,0);
        toast(maintPass() ? (T[lang].loggedas + " " + session.u) : T[lang].maintClosed);
      };

      var g = gate();
      if(!g.hash){ enter(); return; }   // ما فيه بوابة بعد

      // فحص كلمة السر يبيله https. لو فتحها على http يطلع سطر واضح بدل ما تنكسر الصفحة
      if(!cryptoOK()){
        authErr = T[lang].needHttps; aerr.textContent = authErr;
        return;
      }

      gateBusy = true; aerr.textContent = T[lang].working;
      deriveKey(pp, g.salt, g.iter || GATE_ITER).then(function(hash){
        gateBusy = false;
        if(sameHash(hash, g.hash)){ enter(); return; }
        var n = bumpFails();
        var left = coolLeft();
        authErr = left > 0
          ? (T[lang].cooling + " " + coolLabel(left, lang))
          : (T[lang].wrongPass + (n >= 3 ? " (" + n + ")" : ""));
        render();
        var f = document.getElementById("ap"); if(f) f.focus();
      }).catch(function(){
        gateBusy = false;
        aerr.textContent = T[lang].gateFailed;
      });
      return;
    }
    if(act==="ptab"){
      ptab = b.dataset.t;
      if(b.classList.contains("maintbar")){ view = "panel"; window.scrollTo(0,0); }
      render(); return;
    }
    /* ---------- الطلب أونلاين ---------- */
    if(act==="addcart"){
      cartAdd(b.dataset.id, 1);
      render();
      return;
    }
    if(act==="opencart"){
      if(!checkout) checkout = newCheckout();
      sheet = {mode:"cart"};
      render(); renderSheet();
      return;
    }
    if(act==="closecart"){
      sheet = null; lastOrder = null;
      render(); renderSheet();
      return;
    }
    if(act==="qplus" || act==="qminus"){
      saveCheckoutFields();
      cartAdd(b.dataset.id, act==="qplus" ? 1 : -1);
      if(!cart.length){ sheet = null; }
      render(); renderSheet();
      return;
    }
    if(act==="chan"){
      saveCheckoutFields();
      checkout.channel = b.dataset.c;
      renderSheet();
      return;
    }
    if(act==="placeorder"){
      saveCheckoutFields();
      var sh = shop(), tt = cartTotals(), t2 = T[lang];
      checkout.err = "";
      if(checkout.name.trim().length < 2) checkout.err = t2.needName;
      else if(!/^\+?[0-9]{7,15}$/.test(checkout.phone.replace(/[\s-]/g,""))) checkout.err = t2.needPhone;
      else if(checkout.channel === "delivery" && checkout.addr.trim().length < 6) checkout.err = t2.needAddr;
      else if(tt.total < Number(sh.minOrder||0)) checkout.err = t2.minOrderErr + " " + money(sh.minOrder) + " " + DATA.cur[lang];
      if(checkout.err){ renderSheet(); return; }

      var ref = "";
      for(var ri=0; ri<6; ri++) ref += "ABCDEFGHJKLMNPQRSTUVWXYZ23456789".charAt(Math.floor(Math.random()*32));
      var ord = {
        ref: ref, name: checkout.name.trim(), phone: checkout.phone.trim(),
        channel: checkout.channel, addr: checkout.addr.trim(), note: checkout.note.trim(),
        lines: cart.map(function(l){
          var fi = findItemAnywhere(l.id);
          return {ar: fi ? fi.item.ar : "", en: fi ? fi.item.en : "", p: fi ? fi.item.p : 0, q: l.q};
        }),
        sub: tt.sub, deliv: tt.deliv, vat: tt.vat, total: tt.total,
        // في النسخة الحقيقية الدفع يصير على صفحة المزود، والحالة توصل من السيرفر
        paid: false, status: "placed", at: new Date().toISOString()
      };
      DEMO.orders.push(ord); saveDemo();
      lastOrder = ord;
      cart = []; checkout = null;
      render(); renderSheet();
      return;
    }
    if(act==="ordnext"){
      if(!session) return;
      var rr = b.dataset.r;
      for(var oi=0; oi<DEMO.orders.length; oi++){
        if(DEMO.orders[oi].ref === rr){
          var st = DEMO.orders[oi].status;
          DEMO.orders[oi].status = st==="placed" ? "accepted" : st==="accepted" ? "ready" : "completed";
          break;
        }
      }
      saveDemo(); render();
      return;
    }
    if(act==="shoptoggle"){
      if(!isOwner()) return;
      var sh0 = shop();
      if(!sh0.on && !sh0.pickup && !sh0.delivery){ toast(T[lang].needChannel); return; }
      sh0.on = !sh0.on;
      if(!sh0.on){ sh0.pay = false; cart = []; }

  /* ---------- scroll spy + auto-scrolling tab strip ---------- */
  function markCurrentCat(){
    var secs = document.querySelectorAll("section.cat");
    var links = document.querySelectorAll("nav.cats button");
    if(!secs.length || !links.length) return;
    var offset = 96;
    var best = secs[0].id, y = window.scrollY + offset + 12;
    for(var i=0;i<secs.length;i++){ if(secs[i].offsetTop <= y) best = secs[i].id; }
    for(var j=0;j<links.length;j++){
      var on = links[j].dataset.target === best;
      links[j].classList.toggle("current", on);
      if(on && best !== lastCat){
        var sc = links[j].parentNode;
        var target = links[j].offsetLeft - (sc.clientWidth - links[j].offsetWidth)/2;
        sc.scrollTo({left:target, behavior:"smooth"});
      }
    }
    lastCat = best;
  }
  var ticking = false;
  window.addEventListener("scroll", function(){
    if(ticking) return; ticking = true;
    requestAnimationFrame(function(){ markCurrentCat(); ticking = false; });
  }, {passive:true});

  /* ---------- search ---------- */
  function norm(str){
    return String(str||"").toLowerCase()
      .replace(/[\u064B-\u0652\u0640]/g,"")
      .replace(/[\u0623\u0625\u0622]/g,"\u0627")
      .replace(/\u0649/g,"\u064A")
      .replace(/\u0629/g,"\u0647")
      .trim();
  }
  function applyFilter(q){
    var box = document.getElementById("searchbox");
    var nores = document.getElementById("nores");
    var qq = norm(q);
    if(box) box.classList.toggle("has", !!q);
    var secs = document.querySelectorAll("section.cat");
    var total = 0;
    for(var i=0;i<secs.length;i++){
      var cards = secs[i].querySelectorAll(".card"), shown = 0;
      for(var j=0;j<cards.length;j++){
        var nm = cards[j].querySelector(".nm"), ds = cards[j].querySelector(".desc");
        var hay = norm((nm?nm.textContent:"") + " " + (ds?ds.textContent:""));
        var hit = !qq || hay.indexOf(qq) !== -1;
        cards[j].hidden = !hit;
        if(hit){ shown++; total++; }
      }
      secs[i].hidden = qq && shown === 0;
    }
    if(nores) nores.hidden = !(qq && total === 0);
    var strip = document.querySelector("nav.cats");
    if(strip) strip.hidden = !!qq;
    if(!qq){ lastCat = null; markCurrentCat(); }
  }

  /* ---------- reveal on scroll ---------- */
  var revealObs = null;
  function initReveal(){
    var els = document.querySelectorAll(".reveal");
    if(!("IntersectionObserver" in window)){
      for(var k=0;k<els.length;k++) els[k].classList.add("in");
      return;
    }
    if(revealObs) revealObs.disconnect();
    revealObs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add("in"); revealObs.unobserve(en.target); }
      });
    }, {rootMargin:"0px 0px -8% 0px", threshold:0.04});
    for(var i=0;i<els.length;i++){
      var r = els[i].getBoundingClientRect();
      if(r.top < window.innerHeight * 0.96){ els[i].classList.add("in"); }
      else { revealObs.observe(els[i]); }
    }
  }
